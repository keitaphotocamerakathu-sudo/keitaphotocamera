<!doctype html><meta charset=utf-8><body><pre id=o>WAIT</pre><script>
(async()=>{
const fastGpu={canvas:null,gl:null,program:null,buf:null,tex:null,loc:null,failed:false};
function initFastGpu(){
  if(fastGpu.failed)return null;if(fastGpu.gl&&fastGpu.program)return fastGpu;
  try{const canvas=document.createElement('canvas');const gl=canvas.getContext('webgl',{alpha:false,antialias:false,preserveDrawingBuffer:false,premultipliedAlpha:false});if(!gl)throw new Error('WebGL unavailable');
    const vs=`attribute vec2 a_pos;attribute vec2 a_uv;varying vec2 v_uv;void main(){gl_Position=vec4(a_pos,0.0,1.0);v_uv=a_uv;}`;
    const fs=`precision highp float; varying vec2 v_uv;uniform sampler2D u_tex;uniform vec2 u_px;uniform vec3 u_gain;uniform float u_exp,u_contrast,u_hl,u_sh,u_vib,u_green,u_forest,u_skin,u_nr,u_sharp;float lum(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}float ss(float a,float b,float x){float t=clamp((x-a)/(b-a),0.0,1.0);return t*t*(3.0-2.0*t);}bool skinLike(vec3 c){float r=c.r*255.0,g=c.g*255.0,b=c.b*255.0;return r>g*1.05&&g>b*1.05&&(r-b)>18.0&&r>70.0&&g>45.0&&b>25.0;}vec3 sourceSample(){vec3 c=texture2D(u_tex,v_uv).rgb;if(u_nr>0.001||u_sharp>0.001){vec3 n=texture2D(u_tex,v_uv+vec2(0.0,-u_px.y)).rgb;vec3 s=texture2D(u_tex,v_uv+vec2(0.0,u_px.y)).rgb;vec3 e=texture2D(u_tex,v_uv+vec2(u_px.x,0.0)).rgb;vec3 w=texture2D(u_tex,v_uv+vec2(-u_px.x,0.0)).rgb;vec3 avg=(n+s+e+w+c*4.0)/8.0;c=mix(c,avg,clamp(u_nr,0.0,.28));c=clamp(c+(c-avg)*u_sharp,0.0,1.0);}return c;}void main(){vec3 c=sourceSample()*u_gain*u_exp;float L=lum(c);if(u_forest>.5){float target=L;if(u_sh>0.0){float toe=ss(.025,.11,L),fall=1.0-ss(.34,.60,L),mask=toe*fall;target+=max(0.0,.40-L)*u_sh*.72*mask;}if(u_hl<0.0){float shoulder=ss(.52,.90,L),amount=(-u_hl)*.72;target-=max(0.0,L-.50)*amount*shoulder;}target=clamp(target,0.0,1.0);float ratio=clamp(target/max(.012,L),.72,1.42);c*=ratio;float m=lum(c);float mid=(m-.5)*(1.0+min(.035,abs(u_hl-u_sh)*.025));float mt=clamp(.5+mid,0.0,1.0);float mr=clamp(mt/max(.012,m),.93,1.07);c*=mr;}else{if(u_sh>0.0){float m=(1.0-ss(.18,.60,L))*u_sh*.42;float delta=(.52-L)*m;c+=vec3(delta);}if(u_hl<0.0){float m=ss(.55,.96,L)*(-u_hl)*.48;float delta=(L-.55)*m;c-=vec3(delta);}}c=(c-.5)*u_contrast+.5;if(u_green>0.0&&c.g>c.r*1.06&&c.g>c.b*1.06)c.g-=u_green*.12;float avg=(c.r+c.g+c.b)/3.0;float sat=max(max(c.r,c.g),c.b)-min(min(c.r,c.g),c.b);float protect=(u_skin>.5&&skinLike(c))?.2:1.0;float vv=u_vib*(1.0-clamp(sat/.667,0.0,.8))*protect;c=vec3(avg)+(c-vec3(avg))*(1.0+vv);gl_FragColor=vec4(clamp(c,0.0,1.0),1.0);}`;
    function shader(type,src){const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh)||'shader compile');return sh}
    const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'shader link'); fastGpu.gl=gl; fastGpu.program=program; return fastGpu;
  }catch(e){document.getElementById('o').textContent='ERR '+e.stack; return null}}
const x=initFastGpu();document.getElementById('o').textContent=x?'OK':'FAIL';
})();
</script>
