<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>กำลังดาวน์โหลดภาพ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.29.0/sdk.js"></script>
  <script src="js/config.js?v=free-download-bridge-20260924-3"></script>
  <style>
    body { min-height: 100vh; }
    button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <main class="min-h-screen flex items-center justify-center p-5">
    <section class="w-full max-w-md rounded-3xl bg-white p-6 shadow-xl text-center border border-slate-200">
      <div id="iconBox" class="mx-auto w-16 h-16 rounded-2xl bg-violet-100 flex items-center justify-center text-3xl">
        ↓
      </div>

      <h1 class="mt-4 text-2xl font-black">กำลังเตรียมไฟล์ดาวน์โหลด</h1>

      <p id="statusText" class="mt-2 text-sm text-slate-500 min-h-[42px]">
        กรุณารอสักครู่ ระบบกำลังเตรียมภาพพร้อมโลโก้ KEITA
      </p>

      <div class="mt-5 h-2 overflow-hidden rounded-full bg-slate-100">
        <div id="progressBar" class="h-full w-1/4 rounded-full bg-violet-600 transition-all duration-300"></div>
      </div>

      <button
        id="downloadBtn"
        type="button"
        disabled
        class="mt-6 w-full rounded-2xl bg-violet-600 px-5 py-4 font-black text-white disabled:opacity-50"
      >
        กำลังเตรียมไฟล์...
      </button>

      <button
        id="closeBtn"
        type="button"
        class="mt-3 w-full rounded-2xl bg-slate-100 px-5 py-3 font-bold text-slate-700"
      >
        ปิด
      </button>

      <p class="mt-5 text-xs text-slate-400">
        ไฟล์จะถูกดาวน์โหลดลงเครื่อง ไม่เปิดเป็นหน้ารูปภาพ
      </p>
    </section>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const eventId = String(params.get("event") || params.get("event_id") || "").trim();
      const photoId = String(params.get("photo") || params.get("photo_id") || "").trim();

      const statusText = document.getElementById("statusText");
      const downloadBtn = document.getElementById("downloadBtn");
      const closeBtn = document.getElementById("closeBtn");
      const progressBar = document.getElementById("progressBar");
      const iconBox = document.getElementById("iconBox");

      let readyBlobUrl = "";
      let readyFilename = "KEITA-photo.jpg";
      let preparing = false;

      function validUuid(value) {
        return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value);
      }

      function getDownloadUrl() {
        if (!window.CONFIG?.SUPABASE_URL) {
          throw new Error("ไม่พบการตั้งค่า Supabase");
        }

        const url = new URL(
          window.CONFIG.SUPABASE_URL.replace(/\/+$/, "") + "/functions/v1/free-download"
        );

        url.searchParams.set("event_id", eventId);
        url.searchParams.set("photo_id", photoId);
        return url.toString();
      }

      function parseFilename(disposition) {
        const value = String(disposition || "");
        const utf = value.match(/filename\*=UTF-8''([^;]+)/i);

        if (utf?.[1]) {
          try {
            return decodeURIComponent(utf[1].replace(/^"|"$/g, ""));
          } catch (_) {}
        }

        const plain = value.match(/filename="?([^";]+)"?/i);
        return plain?.[1] || "KEITA-photo.jpg";
      }

      function triggerSave() {
        if (!readyBlobUrl) return false;

        const a = document.createElement("a");
        a.href = readyBlobUrl;
        a.download = readyFilename;
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        a.remove();
        return true;
      }

      function setReady() {
        progressBar.style.width = "100%";
        iconBox.textContent = "✓";
        iconBox.className =
          "mx-auto w-16 h-16 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-3xl font-black";
        statusText.textContent =
          "ไฟล์พร้อมแล้ว หากไม่เริ่มดาวน์โหลดอัตโนมัติ ให้กดปุ่มด้านล่าง";
        downloadBtn.disabled = false;
        downloadBtn.textContent = "ดาวน์โหลดลงเครื่อง";
        downloadBtn.className =
          "mt-6 w-full rounded-2xl bg-emerald-600 hover:bg-emerald-700 px-5 py-4 font-black text-white";
      }

      function setError(message) {
        progressBar.style.width = "100%";
        progressBar.className = "h-full w-full rounded-full bg-red-500";
        iconBox.textContent = "!";
        iconBox.className =
          "mx-auto w-16 h-16 rounded-2xl bg-red-100 text-red-700 flex items-center justify-center text-3xl font-black";
        statusText.textContent = message || "เตรียมไฟล์ไม่สำเร็จ กรุณาลองอีกครั้ง";
        downloadBtn.disabled = false;
        downloadBtn.textContent = "ลองดาวน์โหลดอีกครั้ง";
        downloadBtn.className =
          "mt-6 w-full rounded-2xl bg-red-600 hover:bg-red-700 px-5 py-4 font-black text-white";
      }

      async function ensureExternalBrowser() {
        const alreadyExternal = params.get("external") === "1";

        if (alreadyExternal) {
          return false;
        }

        try {
          if (
            window.liff &&
            window.CONFIG?.LIFF_ID &&
            typeof liff.init === "function"
          ) {
            await liff.init({
              liffId: CONFIG.LIFF_ID
            });

            if (
              typeof liff.isInClient === "function" &&
              liff.isInClient() &&
              typeof liff.openWindow === "function"
            ) {
              const externalUrl = new URL(window.location.href);
              externalUrl.searchParams.set("external", "1");
              externalUrl.searchParams.set("v", "20260924-3");

              statusText.textContent = "กำลังเปิด Safari / Chrome เพื่อดาวน์โหลด...";
              progressBar.style.width = "35%";
              downloadBtn.disabled = true;
              downloadBtn.textContent = "กำลังเปิดเบราว์เซอร์...";

              liff.openWindow({
                url: externalUrl.toString(),
                external: true
              });

              return true;
            }
          }
        } catch (error) {
          console.warn("Unable to reopen download outside LINE:", error);
        }

        return false;
      }

      async function prepareAndDownload() {
        if (preparing) return;

        try {
          if (!validUuid(eventId) || !validUuid(photoId)) {
            throw new Error("ข้อมูล Event หรือรูปภาพไม่ถูกต้อง");
          }

          preparing = true;

          const handedOff = await ensureExternalBrowser();
          if (handedOff) {
            return;
          }

          downloadBtn.disabled = true;
          downloadBtn.textContent = "กำลังเตรียมไฟล์...";
          statusText.textContent = "กำลังเตรียมภาพและฝังโลโก้ KEITA...";
          progressBar.style.width = "55%";

          const response = await fetch(getDownloadUrl(), {
            method: "GET",
            cache: "no-store",
          });

          if (!response.ok) {
            const text = await response.text().catch(() => "");
            throw new Error(
              text || "ดาวน์โหลดไม่สำเร็จ (" + response.status + ")"
            );
          }

          const blob = await response.blob();
          readyFilename = parseFilename(response.headers.get("content-disposition"));

          if (readyBlobUrl) {
            URL.revokeObjectURL(readyBlobUrl);
          }

          readyBlobUrl = URL.createObjectURL(blob);
          setReady();

          // First attempt is automatic. If Safari/Chrome blocks the synthetic
          // click, the same Blob remains ready for the visible button.
          setTimeout(() => {
            try {
              triggerSave();
            } catch (error) {
              console.warn("Automatic save was blocked:", error);
            }
          }, 80);
        } catch (error) {
          console.error("Free download bridge error:", error);
          readyBlobUrl = "";
          setError(error?.message || "เตรียมไฟล์ไม่สำเร็จ");
        } finally {
          // If LINE handed the page off to Safari/Chrome, keep this page idle.
          // Otherwise allow retrying the Blob download normally.
          if (params.get("external") === "1" || !window.liff || !window.CONFIG?.LIFF_ID) {
            preparing = false;
          } else {
            try {
              preparing = Boolean(
                typeof liff.isInClient === "function" &&
                liff.isInClient()
              );
            } catch (_) {
              preparing = false;
            }
          }
        }
      }

      downloadBtn.addEventListener("click", () => {
        if (readyBlobUrl) {
          triggerSave();
        } else {
          prepareAndDownload();
        }
      });

      closeBtn.addEventListener("click", () => {
        if (history.length > 1) {
          history.back();
        } else {
          window.close();
        }
      });

      window.addEventListener("pagehide", () => {
        if (readyBlobUrl) {
          URL.revokeObjectURL(readyBlobUrl);
        }
      });

      prepareAndDownload();
    })();
  </script>
</body>
</html>
