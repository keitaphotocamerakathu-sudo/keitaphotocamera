<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KEITA Face Sync</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/config.js?v=new-supabase-004"></script>
  <script src="../js/face-engine-free-v1.js?v=20260921-free2"></script>
  <script src="../js/face-data.js?v=20260921-free2"></script>
  <style>
    :root{color-scheme:dark;background:#0b0d10;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box} body{margin:0;background:#0b0d10;color:#f4f7fb}
    .wrap{max-width:980px;margin:auto;padding:18px 18px 80px}
    .head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
    h1{margin:0;font-size:28px}.sub{color:#9aa4b2;font-size:14px;margin-top:6px}
    .card{background:#13171d;border:1px solid #242b34;border-radius:18px;padding:16px;margin-bottom:14px}
    label{display:block;font-size:13px;color:#aeb7c3;margin-bottom:7px}
    select,input{width:100%;background:#0e1217;color:#fff;border:1px solid #303844;border-radius:12px;padding:12px;font-size:15px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer}
    button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#21c77a;color:#05110b}.secondary{background:#252c35;color:#fff}.danger{background:#ef4444;color:#fff}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#11151a;border:1px solid #242b34;border-radius:14px;padding:13px}.stat b{display:block;font-size:24px;margin-top:3px}
    .bar{height:13px;background:#252c35;border-radius:999px;overflow:hidden}.bar>div{height:100%;width:0;background:#21c77a;transition:width .2s}
    .row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #222933}.row:last-child{border:0}
    .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.muted{color:#8f99a6;font-size:12px}.ok{color:#36d98a}.bad{color:#ff7777}.work{color:#67b3ff}
    #log{max-height:320px;overflow:auto;background:#090b0e;border-radius:12px;padding:12px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
    .status{font-size:18px;font-weight:900;margin-bottom:10px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:end}.pct{font-size:30px;font-weight:900;color:#35d48a}
    @media(max-width:720px){.grid,.grid2,.stats{grid-template-columns:1fr 1fr}.head{display:block}.head button{margin-top:10px}.stats{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="muted">ADMIN · FACE INDEX</div>
      <h1>SYNC FACES · FREE 2</h1>
      <div class="sub">YuNet + SFace · จัดแนวใบหน้า 5 จุด · ประมวลผลบนเครื่อง ไม่มีค่า API เพิ่ม</div>
    </div>
    <div><button class="secondary" onclick="location.href='upload.html'">UPLOAD</button><p><a style="color:#67b3ff" href="process-faces-legacy-v5.html">Face Sync รุ่นเดิม / Ultra Recall</a></p></div>
  </div>

  <div class="card">
    <div class="grid2">
      <div>
        <label>Event</label>
        <select id="eventSelect"><option value="">กำลังโหลด...</option></select>
      </div>
      <div>
        <label>วิดีโอ: วินาทีที่ต้องการสแกน</label>
        <input id="frameSeconds" value="1,3,5,7,9">
      </div>
    </div>
    <div class="grid" style="margin-top:12px">
      <button id="loadBtn" class="secondary">โหลดไฟล์</button>
      <button id="startBtn" class="primary">เริ่ม Sync Faces</button>
      <button id="stopBtn" class="danger" disabled>หยุด</button>
    </div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:12px" class="muted">
      <label style="margin:0"><input id="imagesOnly" type="checkbox" checked style="width:auto"> รูปภาพ</label>
      <label style="margin:0"><input id="videosAlso" type="checkbox" style="width:auto"> วิดีโอ</label>
      <label style="margin:0"><input id="pendingOnly" type="checkbox" checked style="width:auto"> เฉพาะที่ยังไม่ Sync รุ่นนี้</label>
    </div>
  </div>

  <div class="card">
    <div class="topline"><div><div class="muted">สถานะ</div><div id="status" class="status">พร้อมทำงาน</div></div><div id="pct" class="pct">0%</div></div>
    <div class="bar"><div id="bar"></div></div>
    <div class="muted" id="detail" style="margin-top:8px">0 / 0 ไฟล์</div>
  </div>

  <div class="stats">
    <div class="stat"><span class="muted">ทั้งหมด</span><b id="stTotal">0</b></div>
    <div class="stat"><span class="muted">เสร็จ</span><b id="stDone">0</b></div>
    <div class="stat"><span class="muted">ใบหน้า</span><b id="stFaces">0</b></div>
    <div class="stat"><span class="muted">ผิดพลาด</span><b id="stErr">0</b></div>
  </div>

  <div class="card">
    <div style="font-weight:900;margin-bottom:8px">รายการไฟล์</div>
    <div id="files" class="muted">ยังไม่ได้โหลด</div>
  </div>

  <div class="card">
    <div style="font-weight:900;margin-bottom:8px">Log</div>
    <div id="log">พร้อมทำงาน...</div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const SYNC_VERSION=KeitaFaceFree.syncVersion;
  const ENGINE=KeitaFaceFree.engine;
  const sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  const $=id=>document.getElementById(id);
  let items=[],running=false,stopRequested=false,done=0,faces=0,errors=0,startedAt=0,loadToken=0,starting=false;

  function log(msg){
    const line="["+new Date().toLocaleTimeString("th-TH")+"] "+msg;
    $("log").textContent=(line+"\n"+$("log").textContent).split("\n").slice(0,150).join("\n");
    console.log("[FaceSync]",msg);
  }
  function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
  function updateProgress(current=""){
    const total=items.length,p=total?Math.round(done*100/total):0;
    $("bar").style.width=p+"%"; $("pct").textContent=p+"%";
    const rate=done&&startedAt?done/((performance.now()-startedAt)/1000):0;
    const eta=rate?Math.ceil((total-done)/rate):0;
    $("detail").textContent=done.toLocaleString()+" / "+total.toLocaleString()+" ไฟล์"+(rate?" · "+rate.toFixed(2)+" ไฟล์/วินาที · เหลือประมาณ "+Math.floor(eta/60)+":"+String(eta%60).padStart(2,"0"):"");
    $("stTotal").textContent=total; $("stDone").textContent=done; $("stFaces").textContent=faces; $("stErr").textContent=errors;
    if(current) $("status").textContent="กำลังสแกน: "+current;
    else if(running) $("status").textContent="กำลัง Sync Faces...";
    else if(total && done>=total) $("status").textContent="Sync เสร็จแล้ว";
  }
  function normalizeUrl(raw){
    const v=String(raw||"").trim(); if(!v) return "";
    if(/^https?:\/\//i.test(v)) return v;
    const base=String(CONFIG.R2_WORKER_URL||"").replace(/\/+$/,"");
    return base ? base+"/file/"+v.replace(/^\/+/, "") : v;
  }
  function imageUrl(p){
    const key=p.r2_original_key||p.original_path||p.r2_key;
    if(key) return normalizeUrl(key);
    return normalizeUrl(p.face_scan_url||p.r2_preview_url||p.preview_url||p.r2_watermark_url||p.watermark_url||p.face_scan_path||p.preview_path||"");
  }
  function previewUrl(p){return normalizeUrl(p.r2_preview_url||p.preview_url||p.r2_watermark_url||p.watermark_url||p.face_scan_url||"");}
  function videoUrl(p){return normalizeUrl(p.video_preview_url||p.r2_video_preview_url||p.video_url||p.r2_video_url||p.r2_video_key||p.video_path||"");}
  function mediaType(p){
    const m=String(p.media_type||"").toLowerCase(),fn=String(p.filename||"").toLowerCase();
    if(m==="video"||/\.(mp4|mov|webm)$/.test(fn)) return "video";
    return "image";
  }
  function loadImage(url){return KeitaFaceFree.loadImage(url);}
  function loadVideo(url){
    return new Promise((resolve,reject)=>{
      const v=document.createElement("video"); v.crossOrigin="anonymous"; v.preload="auto"; v.muted=true;
      const timer=setTimeout(()=>reject(new Error("โหลดวิดีโอ timeout")),20000);
      v.onloadedmetadata=()=>{clearTimeout(timer);resolve(v)}; v.onerror=()=>{clearTimeout(timer);reject(new Error("โหลดวิดีโอไม่ได้"))};
      v.src=url; v.load();
    });
  }
  function seekVideo(v,t){
    const target=Math.max(0,Math.min(t,Math.max(0,v.duration-0.05)));
    if(Math.abs(v.currentTime-target)<0.01&&v.readyState>=2)return Promise.resolve();
    return new Promise((resolve,reject)=>{
      const cleanup=()=>{clearTimeout(timer);v.removeEventListener('seeked',ok);v.removeEventListener('loadeddata',ready);v.removeEventListener('error',fail);};
      const ok=()=>{cleanup();resolve();};
      const ready=()=>{if(Math.abs(v.currentTime-target)<0.01)ok();};
      const fail=()=>{cleanup();reject(new Error('อ่านเฟรมวิดีโอไม่ได้'));};
      const timer=setTimeout(()=>{cleanup();reject(new Error('seek timeout'));},15000);
      v.addEventListener('seeked',ok);v.addEventListener('loadeddata',ready);v.addEventListener('error',fail);v.currentTime=target;
    });
  }
  function capture(v){
    const c=document.createElement("canvas"); c.width=v.videoWidth; c.height=v.videoHeight;
    c.getContext("2d").drawImage(v,0,0,c.width,c.height); return c;
  }
  function parseTimes(v){
    const arr=String($("frameSeconds").value||"1,3,5,7,9").split(",").map(Number).filter(n=>Number.isFinite(n)&&n>=0);
    const max=Math.max(0,(v.duration||0)-0.05); return [...new Set(arr.map(n=>Math.min(n,max)))];
  }
  async function saveRows(p,rows){
    const {data,error}=await sb.rpc('replace_keita_face_index',{p_photo_id:p.id,p_engine:ENGINE,p_version:SYNC_VERSION,p_faces:rows});
    if(error)throw error;
    const count=Number(data?.face_count);
    if(!Number.isFinite(count)||count!==rows.length)throw new Error('ยืนยันการบันทึกไม่สำเร็จ กรุณาลอง Sync อีกครั้ง');
    p.face_sync_version=SYNC_VERSION;p.face_count=count;return count;
  }
  function rowsFor(scan,extra={}){
    if(scan.skipped)throw new Error('มีใบหน้าที่จัดแนวไม่สำเร็จ เก็บข้อมูลเดิมไว้ กรุณาลองภาพที่ชัดขึ้น');
    return scan.faces.map((d,i)=>({descriptor:d.descriptor,face_index:i,face_box:KeitaFaceFree.normalizedBox(d.box,scan.width,scan.height),media_type:'image',frame_index:null,video_time_seconds:null,...extra}));
  }
  async function scanImage(p){
    const url=imageUrl(p);if(!url)throw new Error('ไม่พบ URL รูป');
    let img,lastError;
    const urls=[url,p.face_scan_url,p.r2_preview_url,p.preview_url,p.r2_watermark_url,p.watermark_url].filter(Boolean).map(normalizeUrl);
    for(const candidate of [...new Set(urls)]){try{img=await loadImage(candidate);break;}catch(error){lastError=error;}}
    if(!img)throw lastError||new Error('โหลดภาพไม่ได้');
    try{
      const scan=await KeitaFaceFree.analyze(img,{deep:true});
      return await saveRows(p,rowsFor(scan));
    }finally{img.src='';}
  }
  async function scanVideo(p){
    const url=videoUrl(p);if(!url)throw new Error('ไม่พบ URL วิดีโอ');
    const v=await loadVideo(url),rows=[];
    try{
      if(!Number.isFinite(v.duration)||v.duration<=0)throw new Error('อ่านความยาววิดีโอไม่ได้');
      const times=parseTimes(v);if(!times.length)throw new Error('กรุณากำหนดวินาทีที่ต้องการสแกน');
      if(times.length>16)throw new Error('กำหนดได้ไม่เกิน 16 เฟรมต่อวิดีโอ');
      for(let i=0;i<times.length;i++){
        await seekVideo(v,times[i]);const cv=capture(v);
        try{
          const scan=await KeitaFaceFree.analyze(cv,{deep:true});
          rows.push(...rowsFor(scan,{media_type:'video',frame_index:i,video_time_seconds:times[i]}));
        }finally{cv.width=cv.height=1;}
      }
      return await saveRows(p,rows);
    }finally{v.pause();v.removeAttribute('src');v.load();}
  }
  function render(){
    if(!items.length){$("files").innerHTML="ไม่มีไฟล์ที่ต้อง Sync";return}
    $("files").innerHTML=items.slice(0,250).map(p=>'<div class="row"><div class="name">'+esc(p.filename||p.id)+'</div><div id="s-'+esc(p.id)+'" class="muted">'+(p.face_sync_version===SYNC_VERSION?'✅ Sync แล้ว':'รอ Sync')+'</div></div>').join("");
  }
  function setFile(p,msg,cls="work"){let el=$("s-"+p.id);if(!el){const row=document.createElement("div");row.className="row";const name=document.createElement("div");name.className="name";name.textContent=p.filename||p.id;el=document.createElement("div");el.id="s-"+p.id;row.append(name,el);$("files").prepend(row);while($("files").children.length>250)$("files").lastElementChild.remove();}if(el){el.textContent=msg;el.className=cls}}
  async function loadEvents(){
    const data=await KeitaFaceData.readAll(()=>sb.from('events').select('id,title,slug,created_at'));
    data.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
    $("eventSelect").innerHTML='<option value="">เลือก Event</option>'+data.map(e=>'<option value="'+esc(e.id)+'">'+esc(e.title||e.name||e.slug||e.id)+'</option>').join("");
    const q=new URLSearchParams(location.search),eid=q.get("event")||q.get("event_id")||q.get("id");
    if(eid){$("eventSelect").value=eid;await loadFiles();}
  }
  async function loadFiles(){
    if(running)return;const token=++loadToken;
    const eid=$("eventSelect").value;if(!eid){items=[];render();updateProgress();return}
    $("status").textContent="กำลังโหลดรายการไฟล์...";
    const data=await KeitaFaceData.readAll(()=>sb.from('photos').select('*').eq('event_id',eid).eq('status','active'),{onPage:n=>{if(token===loadToken)$("status").textContent='กำลังโหลด '+n+' ไฟล์...';}});
    if(token!==loadToken)return;
    const wantImg=$("imagesOnly").checked,wantVideo=$("videosAlso").checked,pending=$("pendingOnly").checked;
    items=(data||[]).filter(p=>{
      const t=mediaType(p); if(t==="image"&&!wantImg)return false;if(t==="video"&&!wantVideo)return false;
      return !pending||String(p.face_sync_version||"")!==SYNC_VERSION;
    });
    done=0;faces=0;errors=0;render();updateProgress();$("status").textContent="พร้อม Sync "+items.length+" ไฟล์";
    log("โหลดไฟล์ "+items.length+" รายการ");
  }
  async function start(){
    if(running||starting) return;
    if(!$("eventSelect").value){await Swal.fire("กรุณาเลือก Event","","warning");return}
    starting=true;$("startBtn").disabled=true;
    try{await loadFiles();}finally{starting=false;$("startBtn").disabled=false;}
    if(!items.length){await Swal.fire("ไม่มีไฟล์ที่ต้อง Sync","","info");return}
    running=true;stopRequested=false;done=0;faces=0;errors=0;startedAt=performance.now();
    ["eventSelect","imagesOnly","videosAlso","pendingOnly","frameSeconds"].forEach(id=>$(id).disabled=true);
    $("startBtn").disabled=true;$("loadBtn").disabled=true;$("stopBtn").disabled=false;
    updateProgress();$("status").textContent="กำลังโหลดโมเดลใบหน้า...";
    try{
      await KeitaFaceFree.load({onProgress:p=>{$("status").textContent='กำลังโหลด '+p.model+' '+Math.round(p.received/p.total*100)+'%';}});
      log('YuNet + SFace พร้อมใช้งาน');
      for(let i=0;i<items.length;i++){
        if(stopRequested) break;
        const p=items[i]; setFile(p,"กำลังสแกน...","work"); updateProgress(p.filename||p.id);
        try{
          const n=mediaType(p)==="video"?await scanVideo(p):await scanImage(p);
          faces+=n; setFile(p,"✅ "+n+" หน้า","ok"); log("✅ "+(p.filename||p.id)+" · "+n+" หน้า");
        }catch(err){
          errors++;setFile(p,"❌ "+(err.message||err),"bad");log("❌ "+(p.filename||p.id)+" · "+(err.message||err));
          console.error(err);
        }
        done++;updateProgress();await new Promise(r=>setTimeout(r,0));
      }
      running=false;updateProgress();$("status").textContent=stopRequested?"หยุดแล้ว":"Sync เสร็จแล้ว";
      await Swal.fire(stopRequested?"หยุดแล้ว":"Sync Faces เสร็จแล้ว","ประมวลผล "+done+" ไฟล์ · พบ "+faces+" ใบหน้า · Error "+errors,stopRequested?"info":(errors?"warning":"success"));
    }catch(err){
      running=false;console.error(err);$("status").textContent="Sync ไม่สำเร็จ: "+(err.message||err);
      await Swal.fire("Sync ไม่สำเร็จ",err.message||String(err),"error");
    }finally{
      running=false;["eventSelect","imagesOnly","videosAlso","pendingOnly","frameSeconds"].forEach(id=>$(id).disabled=false);
      $("startBtn").disabled=false;$("loadBtn").disabled=false;$("stopBtn").disabled=true;
    }
  }

  $("loadBtn").addEventListener("click",()=>loadFiles().catch(e=>Swal.fire("โหลดไฟล์ไม่สำเร็จ",e.message||String(e),"error")));
  $("startBtn").addEventListener("click",()=>start().catch(e=>Swal.fire("Sync ไม่สำเร็จ",e.message||String(e),"error")));
  $("stopBtn").addEventListener("click",()=>{stopRequested=true;$("status").textContent="กำลังหยุดหลังไฟล์ปัจจุบัน..."});
  $("eventSelect").addEventListener("change",()=>loadFiles().catch(e=>Swal.fire("โหลดไฟล์ไม่สำเร็จ",e.message||String(e),"error")));
  ["imagesOnly","videosAlso","pendingOnly"].forEach(id=>$(id).addEventListener("change",()=>loadFiles().catch(console.error)));
  window.addEventListener("error",e=>{console.error("[FaceSync page error]",e.error||e.message)});
  window.addEventListener("unhandledrejection",e=>{console.error("[FaceSync unhandled]",e.reason)});

  loadEvents().catch(async e=>{console.error(e);$("status").textContent="เปิดหน้าไม่สำเร็จ";await Swal.fire("เปิดหน้าไม่สำเร็จ",e.message||String(e),"error")});
})();
</script>
</body>
</html>
