<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Upload Media</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class"
    };
  </script>

  <style>

    body {

<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-white min-h-screen transition safe-bottom">

      </div>

        <div>

        class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-3xl p-8 text-center bg-slate-50 dark:bg-slate-800 transition"
      >

          type="file"

          class="bg-black dark:bg-white dark:text-slate-900 text-white px-6 py-4 rounded-2xl font-black"

          เลือกรูปภาพ / วิดีโอ
        </button>

        <p class="text-sm text-slate-500 dark:text-slate-400 mt-3">
          รองรับรูปภาพ และวิดีโอ MP4 / MOV / WEBM

        <p class="text-xs text-red-500 dark:text-red-300 mt-2 font-bold">
          วิดีโอต้องยาวไม่เกิน 10 วินาที และขนาดไม่เกิน 300MB ต่อไฟล์

          <p id="failCountText" class="text-2xl font-black text-red-600">0</p>

        <div class="bg-slate-50 dark:bg-slate-800 rounded-2xl p-4">
          <p class="text-xs text-slate-500 dark:text-slate-400">รวม</p>
          <p id="totalCountText" class="text-2xl font-black">0</p>
        </div>
      </div>

        id="uploadStatus"
        class="mt-5 space-y-2"

  <script>
    const fileInput = document.getElementById("fileInput");
    const eventSelect = document.getElementById("eventSelect");
    const uploadStatus = document.getElementById("uploadStatus");
    const eventHelp = document.getElementById("eventHelp");
    const workerUrlText = document.getElementById("workerUrlText");
    const fileCountBox = document.getElementById("fileCountBox");

    const successCountText = document.getElementById("successCountText");
    const failCountText = document.getElementById("failCountText");
    const totalCountText = document.getElementById("totalCountText");

    const supabaseClient =
      window.sb ||
      window.supabaseClient ||
      window.supabase.createClient(
        CONFIG.SUPABASE_URL,
        CONFIG.SUPABASE_ANON_KEY
      );

    const FACE_MODEL_URL =
      CONFIG.FACE_MODEL_URL ||
      "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";

    const FACE_SYNC_VERSION = "ultra-recall-v3+facex-v2";
    let faceModelsPromise = null;

    const MAX_VIDEO_SECONDS = 10;
    const MAX_VIDEO_SIZE_MB = 300;
    const MAX_VIDEO_SIZE_BYTES = MAX_VIDEO_SIZE_MB * 1024 * 1024;

    const ALLOWED_VIDEO_TYPES = [
      "video/mp4",
      "video/quicktime",
      "video/webm"
    ];

    let successCount = 0;
    let failCount = 0;
    let totalCount = 0;

    document.addEventListener("DOMContentLoaded", async () => {
      initDarkMode();

      workerUrlText.textContent =
        CONFIG.R2_WORKER_URL || "ยังไม่ได้ตั้งค่า R2_WORKER_URL";

      const ok = await checkR2Config();

      await loadEvents();

      if (!ok) {
        console.warn("R2 Worker ยังไม่พร้อม แต่ยังให้โหลดหน้าได้");
      }
    });

    async function checkR2Config() {
      if (!CONFIG.R2_ENABLED) {
        Swal.fire({
          icon: "warning",
          title: "R2 ยังไม่เปิดใช้งาน",
          text: "กรุณาตั้งค่า R2_ENABLED: true ใน config.js"
        });
        return false;
      }

      if (!CONFIG.R2_WORKER_URL) {
        Swal.fire({
          icon: "warning",
          title: "ไม่พบ R2_WORKER_URL",
          text: "กรุณาเพิ่ม R2_WORKER_URL ใน config.js"
        });
        return false;
      }

      try {
        const res = await fetch(`${CONFIG.R2_WORKER_URL}/health`);
        const data = await res.json().catch(() => null);

        if (!res.ok || !data?.success) {
          throw new Error(data?.message || "R2 Worker ไม่พร้อมใช้งาน");
        }

        if (data.hasBucketBinding === false) {
          throw new Error("Worker ยังไม่ได้ bind R2_BUCKET");
        }

        console.log("R2 Worker Health:", data);
        return true;

      } catch (err) {
        console.error("R2 health error:", err);

        Swal.fire({
          icon: "error",
          title: "เชื่อมต่อ R2 Worker ไม่ได้",
          text: err.message || String(err)
        });

        return false;
      }
    }

    async function loadEvents() {
      eventSelect.innerHTML = `<option value="">กำลังโหลด Event...</option>`;
      eventHelp.textContent = "";

      const { data, error } = await supabaseClient
        .from("events")
        .select("*")
        .in("status", ["published", "active", "draft"])
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Load events error:", error);

        eventSelect.innerHTML = `<option value="">โหลด Event ไม่สำเร็จ</option>`;
        eventHelp.innerHTML = `
          Error: ${escapeHtml(error.message || "ไม่สามารถโหลด Event ได้")}
          <br>
          ถ้าขึ้น 401 ให้ตรวจสอบ RLS Policy ของตาราง events
        `;

        return;
      }

      if (!data || !data.length) {
        eventSelect.innerHTML = `<option value="">ยังไม่มี Event</option>`;
        eventHelp.textContent = "กรุณาสร้าง Event ก่อนอัปโหลดไฟล์";
        return;
      }

      eventSelect.innerHTML = data.map(event => `
        <option value="${escapeAttr(event.id)}" data-price="${escapeAttr(event.price || CONFIG.DEFAULT_PHOTO_PRICE || 50)}">
          ${escapeHtml(event.title || event.name || event.slug || event.id)}
        </option>
      `).join("");

      const params = new URLSearchParams(window.location.search);
      const eventId = params.get("event") || params.get("event_id") || params.get("id");

      if (eventId) {
        eventSelect.value = eventId;
      }

      setPriceFromSelectedEvent();

      eventHelp.textContent = `พบ Event ทั้งหมด ${data.length} รายการ`;
    }

    eventSelect.addEventListener("change", () => {
      setPriceFromSelectedEvent();
    });

    function setPriceFromSelectedEvent() {
      const selected = eventSelect.options[eventSelect.selectedIndex];
      const eventPrice = selected?.dataset?.price;

      if (eventPrice) {
        document.getElementById("price").value = Number(eventPrice || CONFIG.DEFAULT_PHOTO_PRICE || 50);
      }
    }

    function resetCounters(total = 0) {
      successCount = 0;
      failCount = 0;
      totalCount = total;

      updateCounters();
    }

    function updateCounters() {
      successCountText.textContent = successCount;
      failCountText.textContent = failCount;
      totalCountText.textContent = totalCount;
    }

    function getMediaType(file) {
      const type = String(file.type || "").toLowerCase();
      const name = String(file.name || "").toLowerCase();

      if (type.startsWith("image/")) {
        return "image";
      }

      if (
        type.startsWith("video/") ||
        name.endsWith(".mp4") ||
        name.endsWith(".mov") ||
        name.endsWith(".webm")
      ) {
        return "video";
      }

      return "unknown";
    }

    function isAllowedVideo(file) {
      const type = String(file.type || "").toLowerCase();
      const name = String(file.name || "").toLowerCase();

      return (
        ALLOWED_VIDEO_TYPES.includes(type) ||
        name.endsWith(".mp4") ||
        name.endsWith(".mov") ||
        name.endsWith(".webm")
      );
    }

    function formatFileSize(bytes) {
      const size = Number(bytes || 0);

      if (size >= 1024 * 1024 * 1024) {
        return `${(size / 1024 / 1024 / 1024).toFixed(2)} GB`;
      }

      if (size >= 1024 * 1024) {
        return `${(size / 1024 / 1024).toFixed(2)} MB`;
      }

      if (size >= 1024) {
        return `${(size / 1024).toFixed(2)} KB`;
      }

      return `${size} B`;
    }

    function getBaseFilename(filename) {
      return String(filename || "video")
        .replace(/\.[^/.]+$/, "")
        .replace(/[^\wก-๙.-]+/g, "_")
        .slice(0, 80);
    }

    async function ensureUploadFaceModels() {
      if (faceModelsPromise) return faceModelsPromise;

      faceModelsPromise = Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri(FACE_MODEL_URL),
        faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL_URL)
      ]);

      return faceModelsPromise;
    }

    function faceDescriptorDistance(a, b) {
      const aa = Array.from(a || []);
      const bb = Array.from(b || []);

      if (!aa.length || aa.length !== bb.length) return 999;

      let sum = 0;

      for (let i = 0; i < aa.length; i++) {
        const diff = Number(aa[i]) - Number(bb[i]);
        sum += diff * diff;
      }

      return Math.sqrt(sum);
    }

    function dedupeUploadFaces(items, duplicateDistance = 0.18) {
      const sorted = [...(items || [])].sort((a, b) => {
        return Number(b?.detection?.score || 0) - Number(a?.detection?.score || 0);
      });

      const kept = [];

      for (const item of sorted) {
        if (!item?.descriptor) continue;

        const duplicate = kept.some(old =>
          faceDescriptorDistance(item.descriptor, old.descriptor) <= duplicateDistance
        );

        if (!duplicate) kept.push(item);
      }

      return kept;
    }

    function createUploadFaceTiles(img) {
      const width = Number(img.naturalWidth || img.width || 0);
      const height = Number(img.naturalHeight || img.height || 0);

      if (!width || !height || Math.max(width, height) < 1350) {
        return [];
      }

      const tileWidth = Math.min(width, Math.ceil(width * 0.46));
      const tileHeight = Math.min(height, Math.ceil(height * 0.46));
      const xs = [0, Math.max(0, Math.round((width - tileWidth) / 2)), Math.max(0, width - tileWidth)];
      const ys = [0, Math.max(0, Math.round((height - tileHeight) / 2)), Math.max(0, height - tileHeight)];
      const positions = [];
      for (const y of ys) for (const x of xs) positions.push([x, y]);

      return positions.map(([sx, sy]) => {
        const canvas = document.createElement("canvas");
        const maxLongEdge = 2000;
        const ratio = Math.min(
          1,
          maxLongEdge / Math.max(tileWidth, tileHeight)
        );

        canvas.width = Math.max(1, Math.round(tileWidth * ratio));
        canvas.height = Math.max(1, Math.round(tileHeight * ratio));

        const ctx = canvas.getContext("2d");
        if (!ctx) return null;

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(
          img,
          sx,
          sy,
          tileWidth,
          tileHeight,
          0,
          0,
          canvas.width,
          canvas.height
        );

        return canvas;
      }).filter(Boolean);
    }

    function rotateUploadFaceCanvas(input, degrees) {
      const width = Number(input.naturalWidth || input.width || 0);
      const height = Number(input.naturalHeight || input.height || 0);
      const rad = Number(degrees || 0) * Math.PI / 180;
      const sin = Math.abs(Math.sin(rad));
      const cos = Math.abs(Math.cos(rad));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.ceil(width * cos + height * sin));
      canvas.height = Math.max(1, Math.ceil(width * sin + height * cos));
      const ctx = canvas.getContext("2d");
      if (!ctx) return input;
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(rad);
      ctx.drawImage(input, -width / 2, -height / 2, width, height);
      return canvas;
    }

    async function detectUploadFaces(faceScanFile) {
      await ensureUploadFaceModels();

      const img = await faceapi.bufferToImage(faceScanFile);
      const all = [];

      try {
        const ssd = await faceapi
          .detectAllFaces(
            img,
            new faceapi.SsdMobilenetv1Options({ minConfidence: 0.08 })
          )
          .withFaceLandmarks()
          .withFaceDescriptors();

        all.push(...(ssd || []));
      } catch (err) {
        console.warn("Upload SSD face pass failed:", err);
      }

      try {
        const tiny = await faceapi
          .detectAllFaces(
            img,
            new faceapi.TinyFaceDetectorOptions({
              inputSize: 1024,
              scoreThreshold: 0.045
            })
          )
          .withFaceLandmarks()
          .withFaceDescriptors();

        all.push(...(tiny || []));
      } catch (err) {
        console.warn("Upload Tiny face pass failed:", err);
      }

      for (const tile of createUploadFaceTiles(img)) {
        try {
          const found = await faceapi
            .detectAllFaces(
              tile,
              new faceapi.TinyFaceDetectorOptions({
                inputSize: 768,
                scoreThreshold: 0.035
              })
            )
            .withFaceLandmarks()
            .withFaceDescriptors();
          all.push(...(found || []));
        } catch (err) {
          console.warn("Upload Tiny tile face pass failed:", err);
        }

        try {
          const foundSSD = await faceapi
            .detectAllFaces(
              tile,
              new faceapi.SsdMobilenetv1Options({ minConfidence: 0.07 })
            )
            .withFaceLandmarks()
            .withFaceDescriptors();
          all.push(...(foundSSD || []));
        } catch (err) {
          console.warn("Upload SSD tile face pass failed:", err);
        }
      }

      for (const angle of [-30, -15, 15, 30]) {
        const rotated = rotateUploadFaceCanvas(img, angle);
        try {
          const found = await faceapi
            .detectAllFaces(
              rotated,
              new faceapi.TinyFaceDetectorOptions({
                inputSize: 768,
                scoreThreshold: 0.04
              })
            )
            .withFaceLandmarks()
            .withFaceDescriptors();
          all.push(...(found || []));
        } catch (err) {
          console.warn("Upload rotated face pass failed:", angle, err);
        }
      }

      return dedupeUploadFaces(all, 0.16);
    }

    async function autoSyncUploadedImage(photo, faceScanFile, previewUrl) {
      try {
        const detections = await detectUploadFaces(faceScanFile);

        await supabaseClient
          .from("faces")
          .delete()
          .eq("photo_id", photo.id);

        if (detections.length) {
          const rows = detections.map((det, faceIndex) => ({
            event_id: photo.event_id,
            photo_id: photo.id,
            descriptor: Array.from(det.descriptor || []),
            face_index: faceIndex,
            image_url: previewUrl || null,
            filename: photo.filename || null,
            media_type: "image",
            frame_index: null,
            video_time_seconds: null,
            engine: "face-api-v3"
          }));

          const { error: insertError } = await supabaseClient
            .from("faces")
            .insert(rows);

          if (insertError) throw insertError;
        }

        // Add V2 descriptors without removing the legacy set.
        try {
          if (window.KeitaFaceV2) {
            await KeitaFaceV2.load();
            const v2img = await faceapi.bufferToImage(faceScanFile);
            const v2faces = await KeitaFaceV2.analyze(v2img, { deep: true });
            if (v2faces.length) {
              const v2rows = v2faces.map((det, faceIndex) => ({
                event_id: photo.event_id,
                photo_id: photo.id,
                descriptor: Array.from(det.descriptor || []),
                face_index: faceIndex,
                image_url: previewUrl || null,
                filename: photo.filename || null,
                media_type: "image",
                frame_index: null,
                video_time_seconds: null,
                engine: "facex-v2"
              }));
              const { error: v2Error } = await supabaseClient.from("faces").insert(v2rows);
              if (v2Error) throw v2Error;
            }
          }
        } catch (v2Err) {
          console.warn("Face V2 auto-sync skipped; legacy descriptors kept:", v2Err);
        }

        const { error: updateError } = await supabaseClient
          .from("photos")
          .update({
            face_sync_version: FACE_SYNC_VERSION,
            face_synced_at: new Date().toISOString(),
            face_count: detections.length
          })
          .eq("id", photo.id);

        if (updateError) throw updateError;

        return {
          success: true,
          faceCount: detections.length
        };
      } catch (err) {
        console.error("Auto Face Sync failed:", err);

        return {
          success: false,
          faceCount: 0,
          error: err?.message || String(err)
        };
      }
    }

    async function getVideoDuration(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const video = document.createElement("video");

        let finished = false;

        function cleanup() {
          if (finished) return;
          finished = true;
          URL.revokeObjectURL(url);
          video.removeAttribute("src");
          video.load();
        }

        video.preload = "metadata";
        video.muted = true;
        video.playsInline = true;

        video.onloadedmetadata = () => {
          const duration = Number(video.duration || 0);
          cleanup();

          if (!duration || !isFinite(duration)) {
            reject(new Error("อ่านความยาววิดีโอไม่ได้"));
            return;
          }

          resolve(duration);
        };

        video.onerror = () => {
          cleanup();
          reject(new Error("ไฟล์วิดีโอนี้ browser อ่านไม่ได้"));
        };

        setTimeout(() => {
          if (!finished) {
            cleanup();
            reject(new Error("อ่านข้อมูลวิดีโอนานเกินไป"));
          }
        }, 15000);

        video.src = url;
      });
    }

    async function createImagePreviewFile(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          try {
            const sourceWidth = Number(img.naturalWidth || img.width || 0);
            const sourceHeight = Number(img.naturalHeight || img.height || 0);

            if (!sourceWidth || !sourceHeight) {
              throw new Error("อ่านขนาดรูปไม่ได้");
            }

            const maxLongEdge = 1200;
            const ratio = Math.min(
              1,
              maxLongEdge / Math.max(sourceWidth, sourceHeight)
            );

            const width = Math.max(1, Math.round(sourceWidth * ratio));
            const height = Math.max(1, Math.round(sourceHeight * ratio));

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d", { alpha: false });

            if (!ctx) {
              throw new Error("Canvas not supported");
            }

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              URL.revokeObjectURL(url);

              if (!blob) {
                reject(new Error("สร้าง Preview ไม่สำเร็จ"));
                return;
              }

              resolve(
                new File(
                  [blob],
                  `${getBaseFilename(file.name)}_preview.jpg`,
                  { type: "image/jpeg" }
                )
              );
            }, "image/jpeg", 0.72);
          } catch (err) {
            URL.revokeObjectURL(url);
            reject(err);
          }
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Browser เปิดไฟล์รูปไม่ได้"));
        };

        img.src = url;
      });
    }

    async function createFaceScanFile(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          try {
            const sourceWidth = Number(img.naturalWidth || img.width || 0);
            const sourceHeight = Number(img.naturalHeight || img.height || 0);

            if (!sourceWidth || !sourceHeight) {
              throw new Error("อ่านขนาดรูปไม่ได้");
            }

            const maxLongEdge = 3600;
            const ratio = Math.min(
              1,
              maxLongEdge / Math.max(sourceWidth, sourceHeight)
            );

            const width = Math.max(1, Math.round(sourceWidth * ratio));
            const height = Math.max(1, Math.round(sourceHeight * ratio));

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d", { alpha: false });

            if (!ctx) {
              throw new Error("Canvas not supported");
            }

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              URL.revokeObjectURL(url);

              if (!blob) {
                reject(new Error("สร้างไฟล์ Face Scan ไม่สำเร็จ"));
                return;
              }

              resolve(
                new File(
                  [blob],
                  `${getBaseFilename(file.name)}_face_scan.jpg`,
                  { type: "image/jpeg" }
                )
              );
            }, "image/jpeg", 0.86);
          } catch (err) {
            URL.revokeObjectURL(url);
            reject(err);
          }
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Browser เปิดไฟล์รูปไม่ได้"));
        };

        img.src = url;
      });
    }

    async function createVideoThumbnailFile(file, durationSeconds) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(file);
        const video = document.createElement("video");
        const canvas = document.createElement("canvas");

        let finished = false;

        function cleanup() {
          if (finished) return;
          finished = true;
          URL.revokeObjectURL(url);
          video.removeAttribute("src");
          video.load();
        }

        function failSoft(reason) {
          console.warn("Create thumbnail skipped:", reason);
          cleanup();
          resolve(null);
        }

        video.preload = "metadata";
        video.muted = true;
        video.playsInline = true;

        video.onloadedmetadata = () => {
          try {
            const seekTime = Math.min(
              Math.max(Number(durationSeconds || video.duration || 1) * 0.25, 0.1),
              Math.max(Number(video.duration || 1) - 0.1, 0.1)
            );

            video.currentTime = seekTime;
          } catch (err) {
            failSoft(err.message || err);
          }
        };

        video.onseeked = () => {
          try {
            const videoWidth = video.videoWidth || 1280;
            const videoHeight = video.videoHeight || 720;

            const maxWidth = 720;
            const ratio = Math.min(1, maxWidth / videoWidth);

            canvas.width = Math.round(videoWidth * ratio);
            canvas.height = Math.round(videoHeight * ratio);

            const ctx = canvas.getContext("2d");

            if (!ctx) {
              failSoft("Canvas not supported");
              return;
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob((blob) => {
              cleanup();

              if (!blob) {
                resolve(null);
                return;
              }

              const thumbFile = new File(
                [blob],
                `${getBaseFilename(file.name)}_thumbnail.jpg`,
                {
                  type: "image/jpeg"
                }
              );

              resolve(thumbFile);
            }, "image/jpeg", 0.78);

          } catch (err) {
            failSoft(err.message || err);
          }
        };

        video.onerror = () => {
          failSoft("Video load error");
        };

        setTimeout(() => {
          if (!finished) {
            failSoft("Timeout");
          }
        }, 20000);

        video.src = url;
      });
    }

    async function validateMediaFile(file) {
      const mediaType = getMediaType(file);

      if (mediaType === "image") {
        return {
          mediaType: "image",
          durationSeconds: null,
          thumbnailFile: null
        };
      }

      if (mediaType !== "video") {
        throw new Error("รองรับเฉพาะไฟล์รูปภาพ หรือวิดีโอ MP4 / MOV / WEBM");
      }

      if (!isAllowedVideo(file)) {
        throw new Error("รองรับวิดีโอเฉพาะ MP4 / MOV / WEBM");
      }

      if (file.size > MAX_VIDEO_SIZE_BYTES) {
        throw new Error(`วิดีโอขนาดเกิน ${MAX_VIDEO_SIZE_MB}MB`);
      }

      const durationSeconds = await getVideoDuration(file);

      if (durationSeconds > MAX_VIDEO_SECONDS + 0.25) {
        throw new Error(`วิดีโอยาว ${durationSeconds.toFixed(2)} วินาที เกิน ${MAX_VIDEO_SECONDS} วินาที`);
      }

      const thumbnailFile = await createVideoThumbnailFile(file, durationSeconds);

      return {
        mediaType: "video",
        durationSeconds,
        thumbnailFile
      };
    }

    async function uploadFileToR2(file, eventId, folder = "preview") {
      if (!CONFIG.R2_ENABLED) {
        throw new Error("R2 ยังไม่ได้เปิดใช้งานใน config.js");
      }

      if (!CONFIG.R2_WORKER_URL) {
        throw new Error("ไม่พบ R2_WORKER_URL ใน config.js");
      }

      const formData = new FormData();
      formData.append("file", file);
      formData.append("event_id", eventId);
      formData.append("folder", folder);

      const res = await fetch(`${CONFIG.R2_WORKER_URL}/upload`, {
        method: "POST",
        body: formData
      });

      const data = await res.json().catch(() => null);

      if (!res.ok || !data?.success) {
        throw new Error(data?.message || "Upload to R2 failed");
      }

      if (!data.key || !data.publicUrl) {
        throw new Error("Worker ส่งข้อมูล key หรือ publicUrl ไม่ครบ");
      }

      if (!String(data.publicUrl).includes("/file/events/")) {
        console.warn("publicUrl ไม่ใช่ Worker /file URL:", data.publicUrl);
      }

      return data;
    }

    async function saveMediaToSupabase({
      eventId,
      file,
      price,
      mediaType,
      durationSeconds,
      r2Key,
      publicUrl,
      previewKey,
      previewUrl,
      faceScanKey,
      faceScanUrl,
      thumbnailKey,
      thumbnailUrl
    }) {
      const isVideo = mediaType === "video";

      const payload = {
        event_id: eventId,

        media_type: mediaType,
        mime_type: file.type || null,
        file_size: file.size || null,
        duration_seconds: isVideo ? durationSeconds : null,

        filename: file.name,
        price: price,
        status: "active",
        storage_provider: "r2",

        original_path: r2Key,
        preview_path: isVideo ? thumbnailKey : previewKey,
        watermark_path: isVideo ? thumbnailKey : previewKey,

        preview_url: isVideo ? thumbnailUrl : previewUrl,
        watermark_url: isVideo ? thumbnailUrl : previewUrl,

        r2_key: r2Key,
        r2_preview_url: isVideo ? thumbnailUrl : previewUrl,
        r2_watermark_url: isVideo ? thumbnailUrl : previewUrl,
        r2_original_key: r2Key,

        face_scan_path: isVideo ? null : faceScanKey,
        face_scan_url: isVideo ? null : faceScanUrl,

        video_url: isVideo ? publicUrl : null,
        video_path: isVideo ? r2Key : null,
        thumbnail_url: isVideo ? thumbnailUrl : null,
        thumbnail_path: isVideo ? thumbnailKey : null
      };

      const { data, error } = await supabaseClient
        .from("photos")
        .insert(payload)
        .select("*")
        .single();

      if (error) {
        throw new Error(error.message || "บันทึกข้อมูลลง Supabase ไม่สำเร็จ");
      }

      return data;
    }

    async function uploadFile(file, index, total) {
      const eventId = eventSelect.value;
      const price = Number(document.getElementById("price").value || CONFIG.DEFAULT_PHOTO_PRICE || 50);

      if (!eventId) {
        throw new Error("กรุณาเลือก Event");
      }

      const statusDiv = document.createElement("div");

      statusDiv.className =
        "bg-slate-100 dark:bg-slate-800 rounded-2xl p-3 text-sm border border-slate-200 dark:border-slate-700";

      statusDiv.innerHTML = `
        <div class="font-bold">กำลังตรวจสอบไฟล์ ${index}/${total}</div>
        <div class="break-all">${escapeHtml(file.name)}</div>
        <div class="text-xs text-slate-500 mt-1">${escapeHtml(formatFileSize(file.size))}</div>
      `;

      uploadStatus.prepend(statusDiv);

      try {
        const mediaInfo = await validateMediaFile(file);

        const isVideo = mediaInfo.mediaType === "video";
        const uploadFolder = isVideo ? "videos/original" : "images/original";

        statusDiv.innerHTML = `
          <div class="font-bold">กำลังอัปโหลดเข้า R2 ${index}/${total}</div>
          <div class="break-all">${escapeHtml(file.name)}</div>
          <div class="text-xs text-slate-500 mt-1">
            ${isVideo ? `วิดีโอ ${mediaInfo.durationSeconds.toFixed(2)} วินาที` : "รูปภาพ"} · ${escapeHtml(formatFileSize(file.size))}
          </div>
        `;

        const r2Result = await uploadFileToR2(file, eventId, uploadFolder);

        const r2Key = r2Result.key;
        const publicUrl = r2Result.publicUrl;

        let previewKey = null;
        let previewUrl = null;
        let faceScanKey = null;
        let faceScanUrl = null;
        let faceScanFile = null;

        if (!isVideo) {
          statusDiv.innerHTML = `
            <div class="font-bold">กำลังสร้างไฟล์สำหรับสแกนใบหน้า ${index}/${total}</div>
            <div class="break-all">${escapeHtml(file.name)}</div>
            <div class="text-xs text-slate-500 mt-1">
              ด้านยาวไม่เกิน 3,600px · Ultra Recall สำหรับใบหน้าเล็ก/ไกล
            </div>
          `;

          faceScanFile = await createFaceScanFile(file);

          const faceScanResult = await uploadFileToR2(
            faceScanFile,
            eventId,
            "images/face-scan"
          );

          faceScanKey = faceScanResult.key;
          faceScanUrl = faceScanResult.publicUrl;

          statusDiv.innerHTML = `
            <div class="font-bold">กำลังสร้าง Preview เบา ๆ ${index}/${total}</div>
            <div class="break-all">${escapeHtml(file.name)}</div>
            <div class="text-xs text-slate-500 mt-1">
              ย่อด้านยาวไม่เกิน 1,200px · คุณภาพ 72%
            </div>
          `;

          const previewFile = await createImagePreviewFile(file);

          const previewResult = await uploadFileToR2(
            previewFile,
            eventId,
            "images/preview"
          );

          previewKey = previewResult.key;
          previewUrl = previewResult.publicUrl;
        }

        let thumbnailKey = null;
        let thumbnailUrl = null;

        if (isVideo && mediaInfo.thumbnailFile) {
          statusDiv.innerHTML = `
            <div class="font-bold">กำลังอัปโหลด Thumbnail ${index}/${total}</div>
            <div class="break-all">${escapeHtml(file.name)}</div>
            <div class="text-xs text-slate-500 mt-1">
              วิดีโอ ${mediaInfo.durationSeconds.toFixed(2)} วินาที · ${escapeHtml(formatFileSize(file.size))}
            </div>
          `;

          const thumbResult = await uploadFileToR2(
            mediaInfo.thumbnailFile,
            eventId,
            "videos/thumbnail"
          );

          thumbnailKey = thumbResult.key;
          thumbnailUrl = thumbResult.publicUrl;
        }

        const savedMedia = await saveMediaToSupabase({
          eventId,
          file,
          price,
          mediaType: mediaInfo.mediaType,
          durationSeconds: mediaInfo.durationSeconds,
          r2Key,
          publicUrl,
          previewKey,
          previewUrl,
          faceScanKey,
          faceScanUrl,
          thumbnailKey,
          thumbnailUrl
        });

        let faceSyncResult = null;

        if (!isVideo && faceScanFile) {
          statusDiv.innerHTML = `
            <div class="font-bold">กำลัง Auto Sync ใบหน้า ${index}/${total}</div>
            <div class="break-all">${escapeHtml(file.name)}</div>
            <div class="text-xs text-slate-500 mt-1">
              ตรวจหลายรอบเพื่อจับใบหน้าเล็ก/ไกล
            </div>
          `;

          faceSyncResult = await autoSyncUploadedImage(
            savedMedia,
            faceScanFile,
            previewUrl
          );
        }

        const previewHtml = isVideo
          ? `
            <div class="relative w-24 h-16 rounded-xl overflow-hidden bg-black shrink-0">
              ${
                thumbnailUrl
                  ? `<img src="${escapeAttr(thumbnailUrl)}" class="w-full h-full object-cover" onerror="this.style.display='none'">`
                  : `<div class="w-full h-full flex items-center justify-center text-white text-2xl">🎬</div>`
              }
              <div class="absolute inset-0 flex items-center justify-center text-white text-xl bg-black/20">▶</div>
            </div>
          `
          : `
            <div class="w-20 h-16 rounded-xl overflow-hidden bg-slate-200 shrink-0">
              <img
                src="${escapeAttr(previewUrl || publicUrl)}"
                class="w-full h-full object-cover"
                onerror="this.style.display='none'"
              />
            </div>
          `;

        statusDiv.innerHTML = `
          <div class="flex gap-3 items-start">
            ${previewHtml}

            <div class="min-w-0 flex-1">
              <div class="font-bold">✅ อัปโหลดสำเร็จ</div>
              <div class="break-all">${escapeHtml(file.name)}</div>
              <div class="mt-1 text-xs">
                ประเภท: ${isVideo ? "วิดีโอ" : "รูปภาพ"}
                ${isVideo ? ` · ${mediaInfo.durationSeconds.toFixed(2)} วินาที` : ""}
                · ${escapeHtml(formatFileSize(file.size))}
              </div>
              ${
                !isVideo
                  ? `<div class="mt-1 text-xs ${
                      faceSyncResult?.success
                        ? "text-green-800 dark:text-green-200"
                        : "text-amber-700 dark:text-amber-300"
                    }">
                      ${
                        faceSyncResult?.success
                          ? `Face Sync: ${faceSyncResult.faceCount} หน้า`
                          : `Face Sync รอทำใหม่: ${escapeHtml(faceSyncResult?.error || "ไม่สำเร็จ")}`
                      }
                    </div>`
                  : ""
              }
              <div class="mt-1 text-xs break-all">
                Key: ${escapeHtml(r2Key)}
              </div>
              ${
                thumbnailKey
                  ? `<div class="mt-1 text-xs break-all">Thumbnail: ${escapeHtml(thumbnailKey)}</div>`
                  : ""
              }
              <a
                href="${escapeAttr(publicUrl)}"
                target="_blank"
                rel="noopener"
                class="underline text-green-800 dark:text-green-200 text-xs break-all"
              >
                เปิดไฟล์ผ่าน Worker
              </a>
            </div>
          </div>
        `;

        statusDiv.className =
          "bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-200 rounded-2xl p-3 text-sm border border-green-200 dark:border-green-800";

        successCount++;
        updateCounters();

        return {
          success: true,
          fileName: file.name,
          key: r2Key,
          publicUrl,
          mediaType: mediaInfo.mediaType
        };

      } catch (err) {
        console.error("Upload file error:", err);

        statusDiv.innerHTML = `
          <div class="font-bold">❌ อัปโหลดไม่สำเร็จ</div>
          <div class="break-all">${escapeHtml(file.name)}</div>
          <div class="mt-1 text-xs break-all">
            ${escapeHtml(err.message || String(err))}
          </div>
        `;

        statusDiv.className =
          "bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-200 rounded-2xl p-3 text-sm border border-red-200 dark:border-red-800";

        failCount++;
        updateCounters();

        throw err;
      }
    }

    fileInput.addEventListener("change", async (e) => {
      const files = [...e.target.files];

      if (!files.length) return;

      const eventId = eventSelect.value;

      if (!eventId) {
        Swal.fire("กรุณาเลือก Event", "", "warning");
        fileInput.value = "";
        return;
      }

      const imageCount = files.filter(file => getMediaType(file) === "image").length;
      const videoCount = files.filter(file => getMediaType(file) === "video").length;
      const unknownCount = files.length - imageCount - videoCount;

      fileCountBox.textContent =
        `เลือกแล้ว ${files.length} ไฟล์ · รูป ${imageCount} · วิดีโอ ${videoCount}${unknownCount ? ` · ไม่รองรับ ${unknownCount}` : ""}`;

      resetCounters(files.length);

      Swal.fire({
        title: "กำลังอัปโหลด",
        html: `
          ทั้งหมด <b>${files.length}</b> ไฟล์<br>
          รูปภาพ <b>${imageCount}</b> ไฟล์ · วิดีโอ <b>${videoCount}</b> ไฟล์<br>
          <span id="swalProgressText">เริ่มอัปโหลด...</span>
        `,
        allowOutsideClick: false,
        showConfirmButton: false,
        didOpen: () => Swal.showLoading()
      });

      const failedFiles = [];

      for (let i = 0; i < files.length; i++) {
        const file = files[i];

        const progressText = document.getElementById("swalProgressText");

        if (progressText) {
          progressText.textContent =
            `กำลังอัปโหลด ${i + 1}/${files.length}: ${file.name}`;
        }

        try {
          await uploadFile(file, i + 1, files.length);
        } catch (err) {
          failedFiles.push({
            name: file.name,
            message: err.message || String(err)
          });
        }
      }

      Swal.close();

      let failHtml = "";

      if (failedFiles.length) {
        failHtml = `
          <div class="mt-3 text-left text-xs">
            <b>รายการที่ไม่สำเร็จ:</b>
            <ul style="padding-left: 18px;">
              ${failedFiles.map(item => `
                <li>
                  ${escapeHtml(item.name)} : ${escapeHtml(item.message)}
                </li>
              `).join("")}
            </ul>
          </div>
        `;
      }

      Swal.fire({
        icon: failedFiles.length > 0 ? "warning" : "success",
        title: "อัปโหลดเสร็จแล้ว",
        html: `
          สำเร็จ: <b>${successCount}</b> ไฟล์<br>
          ไม่สำเร็จ: <b>${failCount}</b> ไฟล์
          ${failHtml}
        `
      });

      fileInput.value = "";
    });

    function goCreateEvent() {
      window.location.href = "create-event.html";
    }

    /****************************************
     * DARK MODE
     ****************************************/

    function toggleDarkMode() {
      const html = document.documentElement;
      html.classList.toggle("dark");

      const isDark = html.classList.contains("dark");
      localStorage.setItem("darkMode", isDark ? "1" : "0");

      updateDarkButton();
    }

    function updateDarkButton() {
      const btn = document.getElementById("darkBtn");
      if (!btn) return;

      const isDark = document.documentElement.classList.contains("dark");
      btn.innerHTML = isDark ? "☀️ Light" : "🌙 Dark";
    }

    function initDarkMode() {
      const saved = localStorage.getItem("darkMode");

      if (saved === "1") {
        document.documentElement.classList.add("dark");
      }

      updateDarkButton();
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(text) {
      return escapeHtml(text);
    }
  </script>
