<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ดาวน์โหลดไฟล์</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
  </script>

  <script src="https://static.line-scdn.net/liff/edge/versions/2.29.0/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="js/config.js?v=new-supabase-012"></script>
  <script src="js/liff-helper.js?v=new-supabase-012"></script>
  <script src="js/app-liff.js?v=new-supabase-012"></script>

  <style>
    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    img,
    video {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    button,
    select {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .media-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
      background: rgba(0, 0, 0, .64);
      color: white;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .04em;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .play-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .play-circle {
      width: 58px;
      height: 58px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .58);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .download-card-img {
      pointer-events: none;
    }
  </style>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-white transition safe-bottom">

  <main class="max-w-5xl mx-auto p-4 pb-24">

    <header class="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm mb-4 transition">
      <div class="flex justify-between gap-3">
        <div class="min-w-0">
          <p id="txtMiniApp" class="text-xs text-slate-500 dark:text-slate-400">LINE Mini App</p>
          <h1 id="txtPageTitle" class="text-xl font-black">ดาวน์โหลดไฟล์</h1>
          <p id="orderText" class="text-sm text-slate-500 dark:text-slate-400">กำลังโหลดข้อมูล...</p>
        </div>

        <div class="flex flex-col sm:flex-row gap-2 shrink-0">
          <button
            onclick="goOrder()"
            class="bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-full px-4 py-2 font-bold"
          >
            <span id="txtOrderBtn">ออเดอร์</span>
          </button>

          <select
            id="langSelect"
            onchange="changeLanguage(this.value)"
            class="rounded-full bg-slate-100 dark:bg-slate-800 dark:text-white px-3 py-2 text-sm font-bold outline-none"
          >
            <option value="th">🇹🇭 TH</option>
            <option value="en">🇺🇸 EN</option>
            <option value="ru">🇷🇺 RU</option>
          </select>

          <button
            onclick="toggleDarkMode()"
            id="darkBtn"
            class="rounded-full bg-slate-100 dark:bg-slate-800 dark:text-white px-4 py-2 text-sm font-bold"
          >
            🌙 Dark
          </button>
        </div>
      </div>
    </header>

    <section
      id="downloadAllBox"
      class="hidden bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm mb-4 transition"
    >
      <button
        onclick="downloadAllFiles()"
        class="w-full bg-emerald-600 text-white rounded-2xl py-3 font-bold"
      >
        ⬇️ <span id="txtDownloadAll">เปิดไฟล์ทั้งหมดเพื่อบันทึก</span>
      </button>

      <p
        id="txtDownloadAllHint"
        class="mt-3 text-center text-xs text-slate-500 dark:text-slate-400"
      >
        มือถือให้กดเปิดไฟล์ แล้วบันทึกรูปหรือวิดีโอจากหน้าที่เปิดขึ้น
      </p>
    </section>

    <section
      id="loadingBox"
      class="text-center py-10 text-slate-500 dark:text-slate-400"
    >
      กำลังโหลดไฟล์...
    </section>

    <section
      id="photoGrid"
      class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"
    ></section>

    <section id="blockedBox" class="hidden text-center py-16">
      <p class="text-5xl">🔒</p>

      <h2 id="txtBlockedTitle" class="mt-3 text-lg font-bold">
        ยังไม่สามารถดาวน์โหลดได้
      </h2>

      <p id="txtBlockedDesc" class="text-sm text-slate-500 dark:text-slate-400 mt-1">
        กรุณารอแอดมินอนุมัติคำสั่งซื้อก่อน
      </p>

      <button
        onclick="goOrder()"
        class="mt-5 bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-2xl px-5 py-3 font-bold"
      >
        <span id="txtBackOrder">กลับไปหน้าออเดอร์</span>
      </button>
    </section>

  </main>

  <script>
    const db =
      window.sb ||
      window.supabaseClient ||
      window.supabase.createClient(
        CONFIG.SUPABASE_URL,
        CONFIG.SUPABASE_ANON_KEY
      );

    let profile = null;
    let orderId = null;
    let order = null;

    const LANG = {
      th: {
        miniApp: "LINE Mini App",
        pageTitle: "ดาวน์โหลดไฟล์",
        loadingPhoto: "กำลังโหลดไฟล์...",
        orderBtn: "ออเดอร์",
        blockedTitle: "ยังไม่สามารถดาวน์โหลดได้",
        blockedDesc: "กรุณารอแอดมินอนุมัติคำสั่งซื้อก่อน",
        backOrder: "กลับไปหน้าออเดอร์",

        noPhoto: "ไม่พบรายการไฟล์",
        downloadReady: "กดเปิดไฟล์เพื่อบันทึก",
        downloadBtn: "เปิด / ดาวน์โหลด",
        downloadVideoBtn: "เปิด / ดาวน์โหลด VDO",

        downloadAll: "เปิดไฟล์ทั้งหมดเพื่อบันทึก",
        downloadAllHint: "มือถือให้กดเปิดไฟล์ แล้วบันทึกรูปหรือวิดีโอจากหน้าที่เปิดขึ้น",
        downloadAllTitle: "เปิดไฟล์ทั้งหมด",
        downloadAllText: "ระบบจะเปิดไฟล์ทีละรายการ หาก Browser บล็อก popup ให้กดดาวน์โหลดทีละไฟล์",
        startDownload: "เริ่มเปิดไฟล์",
        cancel: "ยกเลิก",

        noFile: "ไม่พบไฟล์",
        noFileDesc: "ยังไม่มี URL สำหรับดาวน์โหลด",
        errorTitle: "เกิดข้อผิดพลาด",

        photoLabel: "PHOTO",
        videoLabel: "VDO",
        priceLabel: "ราคา"
      },

      en: {
        miniApp: "LINE Mini App",
        pageTitle: "Download Files",
        loadingPhoto: "Loading files...",
        orderBtn: "Orders",
        blockedTitle: "Download Not Available Yet",
        blockedDesc: "Please wait for admin approval",
        backOrder: "Back to Orders",

        noPhoto: "No files found",
        downloadReady: "Open the file to save it",
        downloadBtn: "Open / Download",
        downloadVideoBtn: "Open / Download VDO",

        downloadAll: "Open All Files",
        downloadAllHint: "On mobile, open the file and save the photo or video from the opened page",
        downloadAllTitle: "Open All Files",
        downloadAllText: "Files will open one by one. If your browser blocks popups, download them one by one.",
        startDownload: "Start",
        cancel: "Cancel",

        noFile: "File Not Found",
        noFileDesc: "No download URL available",
        errorTitle: "Error",

        photoLabel: "PHOTO",
        videoLabel: "VDO",
        priceLabel: "Price"
      },

      ru: {
        miniApp: "LINE Мини-приложение",
        pageTitle: "Скачать файлы",
        loadingPhoto: "Загрузка файлов...",
        orderBtn: "Заказы",
        blockedTitle: "Скачивание недоступно",
        blockedDesc: "Пожалуйста, дождитесь подтверждения администратора",
        backOrder: "Назад к заказам",

        noPhoto: "Файлы не найдены",
        downloadReady: "Откройте файл, чтобы сохранить",
        downloadBtn: "Открыть / Скачать",
        downloadVideoBtn: "Открыть / Скачать VDO",

        downloadAll: "Открыть все файлы",
        downloadAllHint: "На телефоне откройте файл и сохраните фото или видео",
        downloadAllTitle: "Открыть все файлы",
        downloadAllText: "Файлы будут открываться по одному. Если браузер блокирует окна, скачайте по одному.",
        startDownload: "Начать",
        cancel: "Отмена",

        noFile: "Файл не найден",
        noFileDesc: "URL для скачивания отсутствует",
        errorTitle: "Ошибка",

        photoLabel: "ФОТО",
        videoLabel: "VDO",
        priceLabel: "Цена"
      }
    };

    let currentLang = localStorage.getItem("lang") || "th";

    if (!LANG[currentLang]) {
      currentLang = "th";
      localStorage.setItem("lang", "th");
    }

    function t() {
      return LANG[currentLang] || LANG.th;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        initDarkMode();
        applyLanguage();

        if (!db) {
          throw new Error("ไม่พบ Supabase client");
        }

        try {
          if (window.AppLIFF) {
            profile = await AppLIFF.init();
          }
        } catch (liffErr) {
          console.warn("LIFF init skipped:", liffErr);
        }

        if (!profile) {
          profile = {
            userId: localStorage.getItem("line_user_id") || "",
            displayName: localStorage.getItem("line_display_name") || "Guest",
            pictureUrl: localStorage.getItem("line_picture") || ""
          };
        }

        if (!profile.userId) {
          throw new Error("ไม่พบ LINE user id กรุณาเปิดผ่าน LINE LIFF");
        }

        orderId = getOrderId();

        if (!orderId) {
          throw new Error("ไม่พบ order_id");
        }

        await loadOrder();

      } catch (err) {
        console.error(err);

        const loadingBox = document.getElementById("loadingBox");
        if (loadingBox) {
          loadingBox.classList.add("hidden");
        }

        Swal.fire(
          t().errorTitle,
          err.message || "โหลดข้อมูลไม่สำเร็จ",
          "error"
        );
      }
    });

    function applyLanguage() {
      const x = t();

      document.documentElement.lang = currentLang;

      setText("txtMiniApp", x.miniApp);
      setText("txtPageTitle", x.pageTitle);
      setText("loadingBox", x.loadingPhoto);
      setText("txtOrderBtn", x.orderBtn);
      setText("txtBlockedTitle", x.blockedTitle);
      setText("txtBlockedDesc", x.blockedDesc);
      setText("txtBackOrder", x.backOrder);
      setText("txtDownloadAll", x.downloadAll);
      setText("txtDownloadAllHint", x.downloadAllHint);

      const langSelect = document.getElementById("langSelect");
      if (langSelect) {
        langSelect.value = currentLang;
      }

      updateDarkButton();
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) {
        el.textContent = value;
      }
    }

    function changeLanguage(lang) {
      currentLang = LANG[lang] ? lang : "th";
      localStorage.setItem("lang", currentLang);

      applyLanguage();

      if (order) {
        renderFiles();
      }
    }

    function getOrderId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("order_id") || params.get("id");
    }

    async function loadOrder() {
      const { data, error } = await db
        .from("orders")
        .select(`
          *,
          order_items (
            *,
            photos (*)
          )
        `)
        .eq("id", orderId)
        .eq("line_user_id", profile.userId)
        .single();

      if (error) {
        throw error;
      }

      order = data;

      document.getElementById("loadingBox").classList.add("hidden");

      document.getElementById("orderText").textContent =
        `Order: ${order.order_no || order.id}`;

      if (!isApprovedStatus(order.status)) {
        document.getElementById("blockedBox").classList.remove("hidden");
        return;
      }

      document.getElementById("downloadAllBox").classList.remove("hidden");

      renderFiles();
    }

    function isApprovedStatus(status) {
      const s = String(status || "").toLowerCase();
      return s === "approved" || s === "paid";
    }

    function renderFiles() {
      const grid = document.getElementById("photoGrid");
      const items = order.order_items || [];

      grid.innerHTML = "";

      if (!items.length) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-10 text-slate-500 dark:text-slate-400">
            ${escapeHtml(t().noPhoto)}
          </div>
        `;

        grid.classList.remove("hidden");
        return;
      }

      items.forEach((item, index) => {
        const photo = item.photos || {};
        const mediaIsVideo = isVideoItem(item, photo);

        const preview = getPreviewUrl(item, photo);
        const downloadUrl = getDownloadUrl(item, photo);

        const filename =
          photo.filename ||
          item.filename ||
          item.file_name ||
          item.photo_id ||
          (mediaIsVideo ? "video.mp4" : "photo.jpg");

        const price = Number(item.price || photo.price || 0);

        const card = document.createElement("article");

        card.className =
          "bg-white dark:bg-slate-900 rounded-3xl overflow-hidden shadow-sm transition border border-slate-100 dark:border-slate-800";

        card.innerHTML = `
          <div class="relative bg-slate-200 dark:bg-slate-800">
            <img
              src="${escapeAttr(preview || getPlaceholder(mediaIsVideo ? "VDO" : "Photo"))}"
              class="download-card-img w-full aspect-[3/4] object-cover bg-slate-200 dark:bg-slate-800"
              referrerpolicy="no-referrer"
              draggable="false"
              alt="${escapeAttr(mediaIsVideo ? t().videoLabel : t().photoLabel)}"
              onerror="this.onerror=null; this.src='${escapeAttr(getPlaceholder(mediaIsVideo ? "VDO" : "Photo"))}';"
            />

            <div class="media-badge">
              ${escapeHtml(mediaIsVideo ? t().videoLabel : t().photoLabel)}
            </div>

            ${
              mediaIsVideo
                ? `
                  <div class="play-layer">
                    <div class="play-circle">▶</div>
                  </div>
                `
                : ""
            }
          </div>

          <div class="p-4">
            <p class="font-bold truncate">
              ${escapeHtml(filename)}
            </p>

            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
              ${escapeHtml(t().priceLabel)} ฿${formatMoney(price)}
            </p>

            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
              ${escapeHtml(t().downloadReady)}
            </p>

            <button
              type="button"
              onclick="downloadItemByIndex(${index})"
              class="mt-4 w-full bg-emerald-600 text-white rounded-2xl py-3 font-bold disabled:opacity-40"
              ${downloadUrl ? "" : "disabled"}
            >
              ${escapeHtml(mediaIsVideo ? t().downloadVideoBtn : t().downloadBtn)}
            </button>
          </div>
        `;

        grid.appendChild(card);
      });

      grid.classList.remove("hidden");
    }

    function getMediaType(item, photo) {
      const mediaType = String(item.media_type || photo.media_type || "").toLowerCase();
      const mimeType = String(item.mime_type || photo.mime_type || "").toLowerCase();

      const filename = String(
        item.filename ||
        item.file_name ||
        photo.filename ||
        ""
      ).toLowerCase();

      if (mediaType === "video") return "video";
      if (mediaType === "image") return "image";

      if (
        mimeType.startsWith("video/") ||
        filename.endsWith(".mp4") ||
        filename.endsWith(".mov") ||
        filename.endsWith(".webm") ||
        item.video_url ||
        item.video_path ||
        item.video_preview_url ||
        item.video_preview_path ||
        photo.video_url ||
        photo.video_path ||
        photo.video_preview_url ||
        photo.video_preview_path ||
        photo.r2_video_url ||
        photo.r2_video_key
      ) {
        return "video";
      }

      return "image";
    }

    function isVideoItem(item, photo) {
      return getMediaType(item, photo) === "video";
    }

    function getPreviewUrl(item, photo) {
      const mediaIsVideo = isVideoItem(item, photo);

      const raw = mediaIsVideo
        ? (
            photo.thumbnail_url ||
            photo.r2_thumbnail_url ||
            item.thumbnail_url ||
            item.photo_url ||
            photo.preview_url ||
            photo.r2_preview_url ||
            photo.watermark_url ||
            photo.r2_watermark_url ||
            photo.thumbnail_path ||
            photo.preview_path ||
            ""
          )
        : (
            item.photo_url ||
            photo.r2_watermark_url ||
            photo.r2_preview_url ||
            photo.watermark_url ||
            photo.preview_url ||
            photo.preview_path ||
            photo.watermark_path ||
            photo.r2_key ||
            photo.original_path ||
            ""
          );

      return normalizeFileUrl(raw);
    }

    function getDownloadUrl(item, photo) {
      const mediaIsVideo = isVideoItem(item, photo);

      /*
        สำคัญ:
        - VDO ห้ามใช้ item.photo_url เป็นอันดับแรก เพราะมักเป็น thumbnail/preview
        - VDO ต้องใช้ video_url / video_path ก่อน
        - ภาพนิ่งให้พยายามใช้ original / r2_original_key ก่อน
      */
      const raw = mediaIsVideo
        ? (
            photo.video_url ||
            photo.video_path ||
            photo.r2_video_url ||
            photo.r2_video_key ||
            photo.video_preview_url ||
            photo.video_preview_path ||
            photo.r2_video_preview_url ||
            photo.r2_video_preview_key ||
            photo.r2_original_key ||
            photo.r2_key ||
            photo.original_path ||
            ""
          )
        : (
            photo.r2_original_key ||
            photo.original_path ||
            photo.r2_key ||
            photo.r2_preview_url ||
            photo.preview_url ||
            photo.r2_watermark_url ||
            photo.watermark_url ||
            item.photo_url ||
            photo.preview_path ||
            photo.watermark_path ||
            ""
          );

      return normalizeFileUrl(raw);
    }

    function downloadItemByIndex(index) {
      const items = order?.order_items || [];
      const item = items[index];

      if (!item) {
        Swal.fire(t().noFile, t().noFileDesc, "warning");
        return;
      }

      const photo = item.photos || {};
      const mediaIsVideo = isVideoItem(item, photo);
      const url = getDownloadUrl(item, photo);

      const filename =
        photo.filename ||
        item.filename ||
        item.file_name ||
        item.photo_id ||
        (mediaIsVideo ? "video.mp4" : "photo.jpg");

      downloadFile(url, filename);
    }

    function normalizeFileUrl(url) {
      const cleanUrl = String(url || "").trim();

      if (!cleanUrl) {
        return "";
      }

      if (cleanUrl.startsWith("http://") || cleanUrl.startsWith("https://")) {
        return encodeURI(cleanUrl);
      }

      if (CONFIG.R2_WORKER_URL) {
        const base = String(CONFIG.R2_WORKER_URL).replace(/\/+$/, "");
        const key = cleanUrl.replace(/^\/+/, "");
        return encodeURI(`${base}/file/${key}`);
      }

      if (CONFIG.R2_PUBLIC_BASE_URL) {
        const base = String(CONFIG.R2_PUBLIC_BASE_URL).replace(/\/+$/, "");
        const key = cleanUrl.replace(/^\/+/, "");
        return encodeURI(`${base}/${key}`);
      }

      return encodeURI(cleanUrl);
    }

    function makeForceDownloadUrl(url, filename) {
      if (!url) return "";

      const absoluteUrl = new URL(url, window.location.href);

      const workerBase = String(CONFIG.R2_WORKER_URL || "").replace(/\/+$/, "");

      if (workerBase) {
        const workerUrl = new URL(workerBase);

        if (
          absoluteUrl.origin === workerUrl.origin &&
          absoluteUrl.pathname.startsWith("/file/")
        ) {
          absoluteUrl.pathname =
            absoluteUrl.pathname.replace("/file/", "/download/");

          if (filename) {
            absoluteUrl.searchParams.set("filename", filename);
          }

          return absoluteUrl.href;
        }
      }

      return absoluteUrl.href;
    }

    function downloadFile(url, filename) {
      if (!url) {
        Swal.fire(t().noFile, t().noFileDesc, "warning");
        return;
      }

      const finalUrl = makeForceDownloadUrl(url, filename);

      if (window.liff && liff.isInClient()) {
        liff.openWindow({
          url: finalUrl,
          external: true
        });
        return;
      }

      const a = document.createElement("a");
      a.href = finalUrl;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.download = filename || "file";

      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function downloadAllFiles() {
      if (!order || !isApprovedStatus(order.status)) {
        Swal.fire(
          t().blockedTitle,
          t().blockedDesc,
          "warning"
        );
        return;
      }

      const files = (order.order_items || [])
        .map(item => {
          const photo = item.photos || {};
          const mediaIsVideo = isVideoItem(item, photo);

          return {
            url: getDownloadUrl(item, photo),
            filename:
              photo.filename ||
              item.filename ||
              item.file_name ||
              item.photo_id ||
              (mediaIsVideo ? "video.mp4" : "photo.jpg")
          };
        })
        .filter(item => item.url);

      if (!files.length) {
        Swal.fire(
          t().noFile,
          t().noFileDesc,
          "warning"
        );
        return;
      }

      const confirm = await Swal.fire({
        icon: "info",
        title: t().downloadAllTitle,
        text: t().downloadAllText,
        showCancelButton: true,
        confirmButtonText: t().startDownload,
        cancelButtonText: t().cancel
      });

      if (!confirm.isConfirmed) return;

      for (const file of files) {
        downloadFile(file.url, file.filename);

        await new Promise(resolve =>
          setTimeout(resolve, 900)
        );
      }
    }

    function getPlaceholder(text) {
      return `https://placehold.co/600x800/111827/ffffff?text=${encodeURIComponent(text || "File")}`;
    }

    function goOrder() {
      window.location.href = "order.html";
    }

    function toggleDarkMode() {
      const html = document.documentElement;

      html.classList.toggle("dark");

      const isDark = html.classList.contains("dark");

      localStorage.setItem(
        "darkMode",
        isDark ? "1" : "0"
      );

      updateDarkButton();
    }

    function updateDarkButton() {
      const btn = document.getElementById("darkBtn");

      if (!btn) return;

      const isDark =
        document.documentElement
          .classList
          .contains("dark");

      btn.innerHTML =
        isDark
          ? "☀️ Light"
          : "🌙 Dark";
    }

    function initDarkMode() {
      const saved = localStorage.getItem("darkMode");

      if (saved === "1") {
        document.documentElement.classList.add("dark");
      }

      updateDarkButton();
    }

    function formatMoney(value) {
      return Number(value || 0)
        .toLocaleString(
          "th-TH",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(text) {
      return escapeHtml(text).replace(/`/g, "&#096;");
    }

    document.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    }, true);

    document.addEventListener("dragstart", function(e) {
      e.preventDefault();
    }, true);

    document.addEventListener("keydown", function(e) {
      const key = String(e.key || "").toLowerCase();

      if (e.key === "F12") {
        e.preventDefault();
        return false;
      }

      if ((e.ctrlKey || e.metaKey) && key === "s") {
        e.preventDefault();
        return false;
      }

      if ((e.ctrlKey || e.metaKey) && key === "u") {
        e.preventDefault();
        return false;
      }

      if ((e.ctrlKey || e.metaKey) && key === "p") {
        e.preventDefault();
        return false;
      }

      if ((e.ctrlKey || e.metaKey) && e.shiftKey && key === "i") {
        e.preventDefault();
        return false;
      }

      if ((e.ctrlKey || e.metaKey) && e.shiftKey && key === "j") {
        e.preventDefault();
        return false;
      }

      if ((e.ctrlKey || e.metaKey) && e.shiftKey && key === "c") {
        e.preventDefault();
        return false;
      }
    }, true);
  </script>

</body>
</html>
