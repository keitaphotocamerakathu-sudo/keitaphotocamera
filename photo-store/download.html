<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ดาวน์โหลดภาพ</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
  </script>

  <script src="https://static.line-scdn.net/liff/edge/versions/2.29.0/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="js/config.js?v=new-supabase-010"></script>
  <script src="js/liff-helper.js?v=new-supabase-010"></script>
  <script src="js/app-liff.js?v=new-supabase-010"></script>

  <style>
    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    img {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-white transition safe-bottom">

  <main class="max-w-5xl mx-auto p-4 pb-24">

    <header class="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm mb-4 transition">
      <div class="flex justify-between gap-3">
        <div class="min-w-0">
          <p id="txtMiniApp" class="text-xs text-slate-500 dark:text-slate-400">LINE Mini App</p>
          <h1 id="txtPageTitle" class="text-xl font-black">ดาวน์โหลดภาพ</h1>
          <p id="orderText" class="text-sm text-slate-500 dark:text-slate-400">กำลังโหลดข้อมูล...</p>
        </div>

        <div class="flex flex-col sm:flex-row gap-2 shrink-0">
          <button onclick="goOrder()" class="bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-full px-4 py-2 font-bold">
            <span id="txtOrderBtn">ออเดอร์</span>
          </button>

          <select id="langSelect" onchange="changeLanguage(this.value)" class="rounded-full bg-slate-100 dark:bg-slate-800 dark:text-white px-3 py-2 text-sm font-bold outline-none">
            <option value="th">🇹🇭 TH</option>
            <option value="en">🇺🇸 EN</option>
            <option value="ru">🇷🇺 RU</option>
          </select>

          <button onclick="toggleDarkMode()" id="darkBtn" class="rounded-full bg-slate-100 dark:bg-slate-800 dark:text-white px-4 py-2 text-sm font-bold">
            🌙 Dark
          </button>
        </div>
      </div>
    </header>

    <section id="downloadAllBox" class="hidden bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm mb-4 transition">
      <button onclick="downloadAllFiles()" class="w-full bg-emerald-600 text-white rounded-2xl py-3 font-bold">
        ⬇️ <span id="txtDownloadAll">เปิดรูปทั้งหมดเพื่อบันทึก</span>
      </button>

      <p id="txtDownloadAllHint" class="mt-3 text-center text-xs text-slate-500 dark:text-slate-400">
        มือถือให้กดค้างที่รูป แล้วเลือกบันทึกรูปภาพ
      </p>
    </section>

    <section id="loadingBox" class="text-center py-10 text-slate-500 dark:text-slate-400">
      กำลังโหลดภาพ...
    </section>

    <section id="photoGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></section>

    <section id="blockedBox" class="hidden text-center py-16">
      <p class="text-5xl">🔒</p>

      <h2 id="txtBlockedTitle" class="mt-3 text-lg font-bold">
        ยังไม่สามารถดาวน์โหลดได้
      </h2>

      <p id="txtBlockedDesc" class="text-sm text-slate-500 dark:text-slate-400 mt-1">
        กรุณารอแอดมินอนุมัติคำสั่งซื้อก่อน
      </p>

      <button onclick="goOrder()" class="mt-5 bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-2xl px-5 py-3 font-bold">
        <span id="txtBackOrder">กลับไปหน้าออเดอร์</span>
      </button>
    </section>

  </main>

  <script>
    const db =
      window.sb ||
      window.supabaseClient ||
      window.supabase.createClient(
        CONFIG.SUPABASE_URL,
        CONFIG.SUPABASE_ANON_KEY
      );

    let profile = null;
    let orderId = null;
    let order = null;

    const LANG = {
      th: {
        miniApp: "LINE Mini App",
        pageTitle: "ดาวน์โหลดภาพ",
        loadingPhoto: "กำลังโหลดภาพ...",
        orderBtn: "ออเดอร์",
        blockedTitle: "ยังไม่สามารถดาวน์โหลดได้",
        blockedDesc: "กรุณารอแอดมินอนุมัติคำสั่งซื้อก่อน",
        backOrder: "กลับไปหน้าออเดอร์",
        noPhoto: "ไม่พบรายการภาพ",
        downloadReady: "กดเปิดรูป แล้วกดค้างเพื่อบันทึก",
        downloadBtn: "เปิดรูป / ดาวน์โหลด",
        downloadAll: "เปิดรูปทั้งหมดเพื่อบันทึก",
        downloadAllHint: "มือถือให้กดค้างที่รูป แล้วเลือกบันทึกรูปภาพ",
        downloadAllTitle: "เปิดรูปทั้งหมด",
        downloadAllText: "ระบบจะเปิดรูปทีละภาพ หากอยู่บนมือถือให้กดค้างที่รูปเพื่อบันทึก",
        startDownload: "เริ่มเปิดรูป",
        cancel: "ยกเลิก",
        noFile: "ไม่พบไฟล์",
        noFileDesc: "ยังไม่มี URL สำหรับดาวน์โหลด",
        errorTitle: "เกิดข้อผิดพลาด"
      },

      en: {
        miniApp: "LINE Mini App",
        pageTitle: "Download Photos",
        loadingPhoto: "Loading photos...",
        orderBtn: "Orders",
        blockedTitle: "Download Not Available Yet",
        blockedDesc: "Please wait for admin approval",
        backOrder: "Back to Orders",
        noPhoto: "No photos found",
        downloadReady: "Open the photo, then long-press to save",
        downloadBtn: "Open / Download",
        downloadAll: "Open All Photos",
        downloadAllHint: "On mobile, long-press the photo and choose Save Image",
        downloadAllTitle: "Open All Photos",
        downloadAllText: "Photos will open one by one. On mobile, long-press to save.",
        startDownload: "Start",
        cancel: "Cancel",
        noFile: "File Not Found",
        noFileDesc: "No download URL available",
        errorTitle: "Error"
      },

      ru: {
        miniApp: "LINE Мини-приложение",
        pageTitle: "Скачать Фото",
        loadingPhoto: "Загрузка фотографий...",
        orderBtn: "Заказы",
        blockedTitle: "Скачивание недоступно",
        blockedDesc: "Пожалуйста, дождитесь подтверждения администратора",
        backOrder: "Назад к заказам",
        noPhoto: "Фотографии не найдены",
        downloadReady: "Откройте фото и удерживайте для сохранения",
        downloadBtn: "Открыть / Скачать",
        downloadAll: "Открыть все фото",
        downloadAllHint: "На телефоне удерживайте фото и выберите сохранение",
        downloadAllTitle: "Открыть все фото",
        downloadAllText: "Фото будут открываться по одному. На телефоне удерживайте фото для сохранения.",
        startDownload: "Начать",
        cancel: "Отмена",
        noFile: "Файл не найден",
        noFileDesc: "URL для скачивания отсутствует",
        errorTitle: "Ошибка"
      }
    };

    let currentLang = localStorage.getItem("lang") || "th";

    function t() {
      return LANG[currentLang] || LANG.th;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        initDarkMode();
        applyLanguage();

        if (!db) {
          throw new Error("ไม่พบ Supabase client");
        }

        try {
          if (window.AppLIFF) {
            profile = await AppLIFF.init();
          }
        } catch (liffErr) {
          console.warn("LIFF init skipped:", liffErr);
        }

        if (!profile) {
          profile = {
            userId: localStorage.getItem("line_user_id") || "",
            displayName: localStorage.getItem("line_display_name") || "Guest",
            pictureUrl: localStorage.getItem("line_picture") || ""
          };
        }

        if (!profile.userId) {
          throw new Error("ไม่พบ LINE user id กรุณาเปิดผ่าน LINE LIFF");
        }

        orderId = getOrderId();

        if (!orderId) {
          throw new Error("ไม่พบ order_id");
        }

        await loadOrder();

      } catch (err) {
        console.error(err);

        document.getElementById("loadingBox").classList.add("hidden");

        Swal.fire(
          t().errorTitle,
          err.message || "โหลดข้อมูลไม่สำเร็จ",
          "error"
        );
      }
    });

    function applyLanguage() {
      const x = t();

      document.documentElement.lang = currentLang;

      document.getElementById("txtMiniApp").textContent = x.miniApp;
      document.getElementById("txtPageTitle").textContent = x.pageTitle;
      document.getElementById("loadingBox").textContent = x.loadingPhoto;
      document.getElementById("txtOrderBtn").textContent = x.orderBtn;
      document.getElementById("txtBlockedTitle").textContent = x.blockedTitle;
      document.getElementById("txtBlockedDesc").textContent = x.blockedDesc;
      document.getElementById("txtBackOrder").textContent = x.backOrder;
      document.getElementById("txtDownloadAll").textContent = x.downloadAll;
      document.getElementById("txtDownloadAllHint").textContent = x.downloadAllHint;
      document.getElementById("langSelect").value = currentLang;
    }

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem("lang", lang);

      applyLanguage();

      if (order) {
        renderPhotos();
      }
    }

    function getOrderId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("order_id") || params.get("id");
    }

    async function loadOrder() {
      const { data, error } = await db
        .from("orders")
        .select(`
          *,
          order_items (
            id,
            photo_id,
            event_id,
            filename,
            photo_url,
            price,
            photos (
              id,
              filename,
              preview_url,
              watermark_url,
              r2_preview_url,
              r2_watermark_url,
              r2_key,
              preview_path,
              watermark_path,
              original_path
            )
          )
        `)
        .eq("id", orderId)
        .eq("line_user_id", profile.userId)
        .single();

      if (error) {
        throw error;
      }

      order = data;

      document.getElementById("loadingBox").classList.add("hidden");

      document.getElementById("orderText").textContent =
        `Order: ${order.order_no || order.id}`;

      if (!isApprovedStatus(order.status)) {
        document.getElementById("blockedBox").classList.remove("hidden");
        return;
      }

      document.getElementById("downloadAllBox").classList.remove("hidden");

      renderPhotos();
    }

    function isApprovedStatus(status) {
      const s = String(status || "").toLowerCase();
      return s === "approved" || s === "paid";
    }

    function renderPhotos() {
      const grid = document.getElementById("photoGrid");
      const items = order.order_items || [];

      grid.innerHTML = "";

      if (!items.length) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-10 text-slate-500 dark:text-slate-400">
            ${t().noPhoto}
          </div>
        `;

        grid.classList.remove("hidden");
        return;
      }

      items.forEach(item => {
        const photo = item.photos || {};
        const preview = getPreviewUrl(item, photo);
        const downloadUrl = getDownloadUrl(item, photo);
        const filename = photo.filename || item.filename || item.photo_id || "photo.jpg";

        const card = document.createElement("article");

        card.className =
          "bg-white dark:bg-slate-900 rounded-3xl overflow-hidden shadow-sm transition border border-slate-100 dark:border-slate-800";

        card.innerHTML = `
          <img
            src="${escapeAttr(preview)}"
            class="w-full aspect-[3/4] object-cover bg-slate-200 dark:bg-slate-800"
            referrerpolicy="no-referrer"
            onerror="this.onerror=null; this.src='https://placehold.co/600x800/111827/ffffff?text=Photo';"
          />

          <div class="p-4">
            <p class="font-bold truncate">
              ${escapeHtml(filename)}
            </p>

            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
              ${t().downloadReady}
            </p>

            <button
              type="button"
              onclick="downloadFile('${escapeAttr(downloadUrl)}', '${escapeAttr(filename)}')"
              class="mt-4 w-full bg-emerald-600 text-white rounded-2xl py-3 font-bold disabled:opacity-40"
              ${downloadUrl ? "" : "disabled"}
            >
              ${t().downloadBtn}
            </button>
          </div>
        `;

        grid.appendChild(card);
      });

      grid.classList.remove("hidden");
    }

    function getPreviewUrl(item, photo) {
      const raw =
        item.photo_url ||
        photo.r2_watermark_url ||
        photo.r2_preview_url ||
        photo.watermark_url ||
        photo.preview_url ||
        photo.r2_key ||
        photo.preview_path ||
        photo.watermark_path ||
        photo.original_path ||
        "";

      return normalizeImageUrl(raw);
    }

    function getDownloadUrl(item, photo) {
      const raw =
        item.photo_url ||
        photo.r2_preview_url ||
        photo.preview_url ||
        photo.r2_watermark_url ||
        photo.watermark_url ||
        photo.r2_key ||
        photo.preview_path ||
        photo.watermark_path ||
        photo.original_path ||
        "";

      return normalizeImageUrl(raw);
    }

    function normalizeImageUrl(url) {
      const cleanUrl = String(url || "").trim();

      if (!cleanUrl) {
        return "";
      }

      if (cleanUrl.startsWith("http://") || cleanUrl.startsWith("https://")) {
        return encodeURI(cleanUrl);
      }

      if (CONFIG.R2_WORKER_URL) {
        const base = String(CONFIG.R2_WORKER_URL).replace(/\/+$/, "");
        const key = cleanUrl.replace(/^\/+/, "");

        if (key.startsWith("events/")) {
          return encodeURI(`${base}/file/${key}`);
        }

        return encodeURI(`${base}/file/${key}`);
      }

      if (CONFIG.R2_PUBLIC_BASE_URL) {
        const base = String(CONFIG.R2_PUBLIC_BASE_URL).replace(/\/+$/, "");
        const key = cleanUrl.replace(/^\/+/, "");
        return encodeURI(`${base}/${key}`);
      }

      return encodeURI(cleanUrl);
    }

    function downloadFile(url, filename) {
      if (!url) {
        Swal.fire(t().noFile, t().noFileDesc, "warning");
        return;
      }

      const absoluteUrl = new URL(url, window.location.href).href;

      if (window.liff && liff.isInClient()) {
        liff.openWindow({
          url: absoluteUrl,
          external: true
        });
        return;
      }

      const a = document.createElement("a");
      a.href = absoluteUrl;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.download = filename || "photo.jpg";

      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function downloadAllFiles() {
      if (!order || !isApprovedStatus(order.status)) {
        Swal.fire(
          t().blockedTitle,
          t().blockedDesc,
          "warning"
        );
        return;
      }

      const files = (order.order_items || [])
        .map(item => {
          const photo = item.photos || {};

          return {
            url: getDownloadUrl(item, photo),
            filename: photo.filename || item.filename || item.photo_id || "photo.jpg"
          };
        })
        .filter(item => item.url);

      if (!files.length) {
        Swal.fire(
          t().noFile,
          t().noFileDesc,
          "warning"
        );
        return;
      }

      const confirm = await Swal.fire({
        icon: "info",
        title: t().downloadAllTitle,
        text: t().downloadAllText,
        showCancelButton: true,
        confirmButtonText: t().startDownload,
        cancelButtonText: t().cancel
      });

      if (!confirm.isConfirmed) return;

      for (const file of files) {
        downloadFile(file.url, file.filename);

        await new Promise(resolve =>
          setTimeout(resolve, 900)
        );
      }
    }

    function goOrder() {
      window.location.href = "order.html";
    }

    function toggleDarkMode() {
      const html = document.documentElement;

      html.classList.toggle("dark");

      const isDark = html.classList.contains("dark");

      localStorage.setItem(
        "darkMode",
        isDark ? "1" : "0"
      );

      updateDarkButton();
    }

    function updateDarkButton() {
      const btn = document.getElementById("darkBtn");

      if (!btn) return;

      const isDark =
        document.documentElement
          .classList
          .contains("dark");

      btn.innerHTML =
        isDark
          ? "☀️ Light"
          : "🌙 Dark";
    }

    function initDarkMode() {
      const saved = localStorage.getItem("darkMode");

      if (saved === "1") {
        document.documentElement.classList.add("dark");
      }

      updateDarkButton();
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(text) {
      return escapeHtml(text).replace(/`/g, "&#096;");
    }

    document.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    });

    document.addEventListener("dragstart", function(e) {
      e.preventDefault();
    });

    document.addEventListener("keydown", function(e) {
      if (e.key === "F12") {
        e.preventDefault();
      }

      if (
        (e.ctrlKey || e.metaKey) &&
        e.key.toLowerCase() === "s"
      ) {
        e.preventDefault();
      }

      if (
        (e.ctrlKey || e.metaKey) &&
        e.key.toLowerCase() === "u"
      ) {
        e.preventDefault();
      }

      if (
        (e.ctrlKey || e.metaKey) &&
        e.shiftKey &&
        e.key.toLowerCase() === "i"
      ) {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
