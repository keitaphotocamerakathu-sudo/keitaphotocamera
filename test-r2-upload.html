<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Test R2 Upload</title>
</head>
<body>
  <h2>Test Upload to Cloudflare R2</h2>

  <input type="file" id="fileInput" accept="image/*">
  <button onclick="uploadTest()">Upload Test</button>

  <pre id="result"></pre>

  <script>
    const R2_WORKER_URL = "https://keita-r2-upload.keitaphotocamera.workers.dev";

    async function uploadTest() {
      const file = document.getElementById("fileInput").files[0];
      const result = document.getElementById("result");

      if (!file) {
        alert("กรุณาเลือกรูปก่อน");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);
      formData.append("event_id", "test-event");
      formData.append("folder", "preview");

      result.textContent = "กำลังอัปโหลด...";

      try {
        const res = await fetch(`${R2_WORKER_URL}/upload`, {
          method: "POST",
          body: formData
        });

        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);

        if (data.success) {
          alert("อัปโหลดสำเร็จ");
          window.open(data.publicUrl, "_blank");
        } else {
          alert(data.message || "อัปโหลดไม่สำเร็จ");
        }
      } catch (err) {
        result.textContent = err.message;
        alert("เกิดข้อผิดพลาด");
      }
    }
  </script>
</body>
</html>
